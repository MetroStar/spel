---
version: 0.2

env:
  parameter-store:
    PACKER_GITHUB_API_TOKEN: /granite/codebuild/github-access-token
  variables:
    PACKER_NO_COLOR: 1

phases:
  install:
    commands:
      - |
        if [ "${GRANITE_CI}" = "true" ]
        then
          GRANITE_VERSION=$(date +%Y.%m.dev%s)
          export GRANITE_VERSION
        fi
      - make -f Makefile.granite install
  build:
    commands:
      - make -f Makefile.granite build
  post_build:
    commands:
      - make -f Makefile.granite post_build
      - find . -type f \( -name '*.box' -o -name '*.ova' \) -print0 | xargs -0 rm -f

artifacts:
  files:
    - '**/*'
  base-directory: .granite
