---
version: 0.2

env:
  parameter-store:
    PACKER_GITHUB_API_TOKEN: /chimera/codebuild/github-access-token
  variables:
    PACKER_NO_COLOR: 1

phases:
  install:
    commands:
      - |
        if [ "${CHIMERA_CI}" = "true" ]
        then
          CHIMERA_VERSION=$(date +%Y.%m.dev%s)
          export CHIMERA_VERSION
        fi
      - make -f Makefile.chimera install
  build:
    commands:
      - make -f Makefile.chimera build
  post_build:
    commands:
      - make -f Makefile.chimera post_build
      - find . -type f \( -name '*.box' -o -name '*.ova' \) -print0 | xargs -0 rm -f

artifacts:
  files:
    - '**/*'
  base-directory: .chimera
