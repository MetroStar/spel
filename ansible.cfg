[defaults]
# Collections paths for offline mode (Docker populates crucible/ansible/collections)
collections_path = crucible/ansible/collections:~/.ansible/collections

# Roles paths for offline mode (Docker populates crucible/ansible/roles)
roles_path = crucible/ansible/roles:~/.ansible/roles

[ssh_connection]
# Reduce SSH timeout warnings
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
