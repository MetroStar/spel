# =============================================================================
# GitLab CI/CD Configuration for SPEL Offline Builds (Docker-based)
# =============================================================================
# This pipeline builds STIGed AMIs using a pre-built Docker container.
# The container has all dependencies baked in for air-gapped environments.
#
# PREREQUISITES:
#   1. Docker image tarball must be transferred to $DOCKER_IMAGE_PATH
#      - Build using GitHub Actions: offline-prepare.yml
#      - Export: docker save spel-builder:TAG | gzip > spel-builder-TAG.tar.gz
#      - Transfer to runner's accessible location
#
#   2. GitLab Runner must have Docker installed and running
#
#   3. CI/CD Variables required:
#      - AWS_ACCESS_KEY_ID
#      - AWS_SECRET_ACCESS_KEY
#      - AWS_SESSION_TOKEN (optional, for OIDC/STS credentials)
#      - DOCKER_IMAGE_PATH (path to spel-builder-*.tar.gz)
#
#   4. Public AMI quota must be increased if building multiple AMIs concurrently:
#        aws service-quotas request-service-quota-increase \
#          --service-code ec2 --quota-code L-0E3CBAB9 --desired-value 20 \
#          --region us-gov-east-1
#
# PIPELINE STAGES:
#   1. import - Import Docker image from tarball
#   2. infra  - Create AWS infrastructure (optional, one-time setup)
#   3. build  - Build AMIs using Docker container
# =============================================================================

variables:
  SPEL_IDENTIFIER: "spel"
  PKR_VAR_aws_region: "us-gov-east-1"
  PACKER_LOG: "1"
  CHECKPOINT_DISABLE: "1"
  # Infrastructure naming
  INFRA_PREFIX: "spel-offline"
  # Docker image location (must be transferred to this path)
  DOCKER_IMAGE_PATH: "/transfer/spel-builder-*.tar.gz"
  # Local yum repository mirror for air-gapped Linux builds
  # Set this to your internal mirror URL, e.g., http://mirror.internal.mil
  # Leave empty to use default RHUI/public repositories (requires internet access)
  REPO_MIRROR_BASEURL: ""
  # Cross-distro build mode for air-gapped Linux builds
  # Set to "true" to skip RHUI package auto-detection (prevents rh-amazon-rhui-client install)
  # Required when using local repo mirrors instead of RHUI
  AMIGEN_CROSS_DISTRO: "false"
  # Disable default RHUI repositories for air-gapped builds
  # Set to "false" to use only custom repos specified below
  AMIGEN_USE_DEFAULT_REPOS: "true"
  # Custom repository names for air-gapped builds (JSON array format)
  # For RHEL8: '["rhel-8-baseos","rhel-8-appstream"]'
  # For RHEL9: '["rhel-9-baseos","rhel-9-appstream"]'
  # Leave empty to use defaults (requires RHUI or internet access)
  AMIGEN8_REPO_NAMES: ""
  AMIGEN9_REPO_NAMES: ""
  # Repository source RPMs for air-gapped builds (JSON array format)
  # These are RPMs that install yum repo configuration files into /etc/yum.repos.d/
  # Example: '["http://mirror.internal.mil/repos/myorg-release-1.0-1.el8.noarch.rpm"]'
  # Leave empty if repo files are already present or using RHUI (requires internet access)
  AMIGEN8_REPO_SOURCES: ""
  AMIGEN9_REPO_SOURCES: ""
  # Extra RPMs for air-gapped builds (JSON array format)
  # These override defaults to exclude RHUI-dependent packages like rh-amazon-rhui-client
  # RHEL8 default: '["python39","python39-pip","python39-setuptools","crypto-policies-scripts","ec2-hibinit-agent","ec2-instance-connect","ec2-instance-connect-selinux","ec2-utils"]'
  # RHEL9 default: '["crypto-policies-scripts","ec2-hibinit-agent","ec2-utils"]'
  # Leave empty to use upstream defaults (which include rh-amazon-rhui-client)
  AMIGEN8_EXTRA_RPMS: ""
  AMIGEN9_EXTRA_RPMS: ""
  # Skip RPM signature check for unsigned repo RPMs (air-gapped environments)
  # Set to "true" when using unsigned/self-built repo RPMs
  AMIGEN_REPO_NOSIGNATURE: "false"
  # Disable SSL certificate verification for yum/dnf (air-gapped environments)
  # Set to "true" when using internal mirrors with self-signed certificates
  AMIGEN_SSLVERIFY_DISABLE: "false"
  # Customer Managed Key (CMK) for EBS volume encryption
  # Set this to your KMS key ARN for encrypted AMIs, e.g., arn:aws-us-gov:kms:us-gov-east-1:123456789012:key/12345678-1234-1234-1234-123456789012
  # Leave empty to disable encryption or use default AWS-managed key
  PKR_VAR_aws_kms_key_id: ""
  # IAM instance profile for build instances
  # Set this to use a pre-created instance profile (e.g., from infra job)
  # Leave empty to have Packer create a temporary one (requires IAM permissions)
  PKR_VAR_aws_iam_instance_profile: ""
  # Create temporary infrastructure for this build (auto-destroyed after build)
  # Set to "false" to use pre-existing infrastructure instead
  CREATE_TEMP_INFRA: "true"

stages:
  - import       # Import Docker image from tarball
  - infra        # Create AWS infrastructure (optional one-time setup)
  - build        # Build AMIs

# Default settings for all jobs
default:
  before_script:
    - echo "Starting job on $(hostname)"
    - echo "Git commit - ${CI_COMMIT_SHA}"

#############################################################################
# Import Stage - Import Docker Image from Tarball
#############################################################################

import:docker:
  stage: import
  script:
    - echo "=== Importing Docker Image ==="
    - echo ""
    
    # Find the Docker image file (tarball or base64)
    - |
      # Check for base64 encoded file first (SharePoint transfer)
      BASE64_FILE=$(ls -t ${DOCKER_IMAGE_PATH%.tar.gz}.tar.gz.b64 2>/dev/null | head -1)
      
      if [ -n "$BASE64_FILE" ]; then
        echo "Found base64 encoded file (SharePoint transfer): ${BASE64_FILE}"
        
        # Verify base64 checksum
        BASE64_CHECKSUM="${BASE64_FILE}.sha256"
        if [ -f "$BASE64_CHECKSUM" ]; then
          echo "Verifying base64 checksum..."
          BASE64_DIR=$(dirname "${BASE64_FILE}")
          BASE64_NAME=$(basename "${BASE64_FILE}")
          pushd "${BASE64_DIR}" > /dev/null
          if sha256sum -c "${BASE64_NAME}.sha256"; then
            echo "✓ Base64 file checksum verified"
          else
            echo "ERROR: Base64 checksum verification failed!"
            exit 1
          fi
          popd > /dev/null
        fi
        
        # Decode base64 to tarball
        echo "Decoding base64..."
        TARBALL="${BASE64_FILE%.b64}"
        base64 -d "${BASE64_FILE}" > "${TARBALL}"
        echo "✓ Decoded to ${TARBALL}"
        ls -lh "${TARBALL}"
      else
        # Look for regular tarball (direct transfer)
        TARBALL=$(ls -t ${DOCKER_IMAGE_PATH} 2>/dev/null | head -1)
        
        if [ -z "$TARBALL" ]; then
          echo "ERROR: No Docker image tarball or base64 file found!"
          echo ""
          echo "Expected location: ${DOCKER_IMAGE_PATH}"
          echo ""
          echo "To resolve:"
          echo "  1. Run the offline-prepare.yml workflow in GitHub Actions"
          echo "  2. Download the spel-builder-YYYYMMDD artifact"
          echo "  3. Transfer files to: /transfer/"
          echo ""
          echo "For SharePoint transfer (recommended):"
          echo "  - Transfer spel-builder-*.tar.gz.b64 (base64 encoded)"
          echo "  - Transfer spel-builder-*.tar.gz.b64.sha256 (checksum)"
          echo ""
          echo "For direct transfer (SCP/USB/S3):"
          echo "  - Transfer spel-builder-*.tar.gz (binary)"
          echo "  - Transfer spel-builder-*.tar.gz.sha256 (checksum)"
          echo ""
          exit 1
        fi
        
        echo "Found tarball: ${TARBALL}"
        ls -lh "${TARBALL}"
      fi
    
    # Verify tarball checksum if available
    - |
      CHECKSUM_FILE="${TARBALL}.sha256"
      if [ -f "$CHECKSUM_FILE" ]; then
        echo ""
        echo "Verifying tarball checksum..."
        # Run checksum from the directory containing the tarball
        TARBALL_DIR=$(dirname "${TARBALL}")
        TARBALL_NAME=$(basename "${TARBALL}")
        pushd "${TARBALL_DIR}" > /dev/null
        if sha256sum -c "${TARBALL_NAME}.sha256"; then
          echo "✓ Tarball checksum verification passed"
        else
          echo "ERROR: Tarball checksum verification failed!"
          echo ""
          echo "The file was corrupted during transfer."
          echo "If you used SharePoint, transfer the .b64 file instead."
          exit 1
        fi
        popd > /dev/null
      fi
    
    # Import the Docker image
    - |
      echo ""
      echo "Importing Docker image..."
      gunzip -c "${TARBALL}" | docker load
      
      # Extract image tag from tarball name
      IMAGE_TAG=$(basename "${TARBALL}" .tar.gz | sed 's/spel-builder-//')
      echo "DOCKER_IMAGE_TAG=${IMAGE_TAG}" >> import.env
      
      echo ""
      echo "=== Import Complete ==="
      docker images spel-builder
    
    # Verify the image works
    - |
      echo ""
      echo "=== Verifying Docker Image ==="
      docker run --rm "spel-builder:${IMAGE_TAG}" packer version
      docker run --rm "spel-builder:${IMAGE_TAG}" ansible --version
      docker run --rm "spel-builder:${IMAGE_TAG}" aws --version
    
    # Show image details (for version tracking)
    - |
      echo ""
      echo "=== Docker Image Details ==="
      docker inspect "spel-builder:${IMAGE_TAG}" --format='Image ID: {{.Id}}'
      docker inspect "spel-builder:${IMAGE_TAG}" --format='Created: {{.Created}}'
      docker inspect "spel-builder:${IMAGE_TAG}" --format='Size: {{.Size}} bytes'
      echo ""
      echo "Full image inspect output:"
      docker inspect "spel-builder:${IMAGE_TAG}" | head -50
      echo "==========================="
  artifacts:
    reports:
      dotenv: import.env
    expire_in: 7 days
  tags:
    - spel-offline-runner
  rules:
    - if: '$IMPORT_DOCKER == "true"'
      when: manual
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual

#############################################################################
# Infrastructure Stage - Create AWS Resources (Optional One-Time Setup)
#############################################################################

# Create or verify VPC and networking
infra:network:
  stage: infra
  script:
    - echo "Setting up AWS network infrastructure..."
    - export AWS_DEFAULT_REGION="${PKR_VAR_aws_region}"
    
    # Check if VPC already exists
    - |
      VPC_NAME="${INFRA_PREFIX}-vpc"
      EXISTING_VPC=$(aws ec2 describe-vpcs \
        --filters "Name=tag:Name,Values=${VPC_NAME}" \
        --query 'Vpcs[0].VpcId' --output text 2>/dev/null || echo "None")
      
      if [ "$EXISTING_VPC" != "None" ] && [ -n "$EXISTING_VPC" ]; then
        echo "✓ VPC already exists: ${EXISTING_VPC}"
        echo "PKR_VAR_aws_vpc_id=${EXISTING_VPC}" > network.env
      else
        echo "Creating VPC..."
        VPC_ID=$(aws ec2 create-vpc \
          --cidr-block 10.0.0.0/16 \
          --query 'Vpc.VpcId' --output text)
        
        aws ec2 create-tags --resources "${VPC_ID}" \
          --tags Key=Name,Value="${VPC_NAME}" Key=Project,Value=SPEL Key=Environment,Value=Offline
        
        aws ec2 modify-vpc-attribute --vpc-id "${VPC_ID}" --enable-dns-hostnames
        aws ec2 modify-vpc-attribute --vpc-id "${VPC_ID}" --enable-dns-support
        
        echo "PKR_VAR_aws_vpc_id=${VPC_ID}" > network.env
        echo "✓ Created VPC: ${VPC_ID}"
      fi
    
    # Create or get subnet
    - |
      source network.env
      SUBNET_NAME="${INFRA_PREFIX}-subnet"
      EXISTING_SUBNET=$(aws ec2 describe-subnets \
        --filters "Name=tag:Name,Values=${SUBNET_NAME}" "Name=vpc-id,Values=${PKR_VAR_aws_vpc_id}" \
        --query 'Subnets[0].SubnetId' --output text 2>/dev/null || echo "None")
      
      if [ "$EXISTING_SUBNET" != "None" ] && [ -n "$EXISTING_SUBNET" ]; then
        echo "✓ Subnet already exists: ${EXISTING_SUBNET}"
        echo "PKR_VAR_aws_subnet_id=${EXISTING_SUBNET}" >> network.env
      else
        echo "Creating subnet..."
        AZ=$(aws ec2 describe-availability-zones --query 'AvailabilityZones[0].ZoneName' --output text)
        SUBNET_ID=$(aws ec2 create-subnet \
          --vpc-id "${PKR_VAR_aws_vpc_id}" \
          --cidr-block 10.0.1.0/24 \
          --availability-zone "${AZ}" \
          --query 'Subnet.SubnetId' --output text)
        
        aws ec2 create-tags --resources "${SUBNET_ID}" \
          --tags Key=Name,Value="${SUBNET_NAME}" Key=Project,Value=SPEL Key=Environment,Value=Offline
        
        aws ec2 modify-subnet-attribute --subnet-id "${SUBNET_ID}" --map-public-ip-on-launch
        
        echo "PKR_VAR_aws_subnet_id=${SUBNET_ID}" >> network.env
        echo "✓ Created subnet: ${SUBNET_ID}"
      fi
    
    - cat network.env
  artifacts:
    reports:
      dotenv: network.env
    expire_in: 90 days
  tags:
    - spel-offline-runner
  rules:
    - if: '$CREATE_INFRASTRUCTURE == "true"'
      when: manual

# Create Security Group
infra:security_group:
  stage: infra
  needs: ["infra:network"]
  script:
    - echo "Creating security group for Packer builders..."
    - export AWS_DEFAULT_REGION="${PKR_VAR_aws_region}"
    
    - |
      SG_NAME="${INFRA_PREFIX}-packer-sg"
      EXISTING_SG=$(aws ec2 describe-security-groups \
        --filters "Name=group-name,Values=${SG_NAME}" "Name=vpc-id,Values=${PKR_VAR_aws_vpc_id}" \
        --query 'SecurityGroups[0].GroupId' --output text 2>/dev/null || echo "None")
      
      if [ "$EXISTING_SG" != "None" ] && [ -n "$EXISTING_SG" ]; then
        echo "✓ Security group already exists: ${EXISTING_SG}"
        echo "PKR_VAR_aws_security_group_id=${EXISTING_SG}" > sg.env
      else
        echo "Creating security group..."
        SG_ID=$(aws ec2 create-security-group \
          --group-name "${SG_NAME}" \
          --description "Security group for SPEL Packer builders" \
          --vpc-id "${PKR_VAR_aws_vpc_id}" \
          --query 'GroupId' --output text)
        
        aws ec2 create-tags --resources "${SG_ID}" \
          --tags Key=Name,Value="${SG_NAME}" Key=Project,Value=SPEL Key=Environment,Value=Offline
        
        # Allow SSH from VPC CIDR
        aws ec2 authorize-security-group-ingress \
          --group-id "${SG_ID}" \
          --protocol tcp --port 22 \
          --cidr 10.0.0.0/16
        
        echo "PKR_VAR_aws_security_group_id=${SG_ID}" > sg.env
        echo "✓ Created security group: ${SG_ID}"
      fi
  artifacts:
    reports:
      dotenv: sg.env
    expire_in: 90 days
  tags:
    - spel-offline-runner
  rules:
    - if: '$CREATE_INFRASTRUCTURE == "true"'
      when: manual

# Create IAM resources
infra:iam:
  stage: infra
  script:
    - echo "Creating IAM role and instance profile for Packer..."
    - export AWS_DEFAULT_REGION="${PKR_VAR_aws_region}"
    
    # Create IAM role
    - |
      ROLE_NAME="${INFRA_PREFIX}-packer-builder-role"
      
      if aws iam get-role --role-name "${ROLE_NAME}" &>/dev/null; then
        echo "✓ IAM role already exists: ${ROLE_NAME}"
      else
        echo "Creating IAM role..."
        cat > trust-policy.json <<'EOF'
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Principal": {
              "Service": "ec2.amazonaws.com"
            },
            "Action": "sts:AssumeRole"
          }
        ]
      }
      EOF
        
        aws iam create-role \
          --role-name "${ROLE_NAME}" \
          --assume-role-policy-document file://trust-policy.json \
          --description "Role for SPEL Packer builders" \
          --max-session-duration 21600
        
        echo "✓ Created IAM role: ${ROLE_NAME} (max session: 6 hours)"
      fi
    
    # Create and attach IAM policy for Packer EC2 instance
    - |
      POLICY_NAME="${INFRA_PREFIX}-packer-builder-policy"
      ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      
      # Check if policy already exists
      EXISTING_POLICY=$(aws iam list-policies --scope Local \
        --query "Policies[?PolicyName=='${POLICY_NAME}'].Arn" --output text 2>/dev/null)
      
      if [ -n "$EXISTING_POLICY" ] && [ "$EXISTING_POLICY" != "None" ]; then
        echo "✓ IAM policy already exists: ${POLICY_NAME}"
        POLICY_ARN="$EXISTING_POLICY"
      else
        echo "Creating IAM policy..."
        
        # Policy for EC2 instance role (what the Packer-launched instance needs)
        # This is minimal - the instance just needs to communicate with SSM/S3
        cat > packer-policy.json <<EOF
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Sid": "SSMAccess",
            "Effect": "Allow",
            "Action": [
              "ssm:UpdateInstanceInformation",
              "ssmmessages:CreateControlChannel",
              "ssmmessages:CreateDataChannel",
              "ssmmessages:OpenControlChannel",
              "ssmmessages:OpenDataChannel",
              "ec2messages:AcknowledgeMessage",
              "ec2messages:DeleteMessage",
              "ec2messages:FailMessage",
              "ec2messages:GetEndpoint",
              "ec2messages:GetMessages",
              "ec2messages:SendReply"
            ],
            "Resource": "*"
          },
          {
            "Sid": "S3Access",
            "Effect": "Allow",
            "Action": [
              "s3:GetObject",
              "s3:ListBucket"
            ],
            "Resource": [
              "arn:*:s3:::aws-ssm-${PKR_VAR_aws_region}/*",
              "arn:*:s3:::aws-ssm-${PKR_VAR_aws_region}",
              "arn:*:s3:::amazon-ssm-${PKR_VAR_aws_region}/*",
              "arn:*:s3:::amazon-ssm-${PKR_VAR_aws_region}",
              "arn:*:s3:::${PKR_VAR_aws_region}-birdwatcher-prod/*",
              "arn:*:s3:::${PKR_VAR_aws_region}-birdwatcher-prod"
            ]
          },
          {
            "Sid": "CloudWatchLogs",
            "Effect": "Allow",
            "Action": [
              "logs:CreateLogStream",
              "logs:PutLogEvents",
              "logs:DescribeLogGroups",
              "logs:DescribeLogStreams"
            ],
            "Resource": "*"
          }
        ]
      }
      EOF
        
        POLICY_ARN=$(aws iam create-policy \
          --policy-name "${POLICY_NAME}" \
          --policy-document file://packer-policy.json \
          --description "Policy for SPEL Packer builder EC2 instances" \
          --query 'Policy.Arn' --output text)
        
        echo "✓ Created IAM policy: ${POLICY_NAME}"
      fi
      
      # Attach policy to role
      if aws iam list-attached-role-policies --role-name "${ROLE_NAME}" \
          --query "AttachedPolicies[?PolicyArn=='${POLICY_ARN}']" --output text | grep -q .; then
        echo "✓ Policy already attached to role"
      else
        echo "Attaching policy to role..."
        aws iam attach-role-policy \
          --role-name "${ROLE_NAME}" \
          --policy-arn "${POLICY_ARN}"
        echo "✓ Attached policy to role"
      fi
    
    # Create instance profile
    - |
      PROFILE_NAME="${INFRA_PREFIX}-packer-builder-profile"
      
      if aws iam get-instance-profile --instance-profile-name "${PROFILE_NAME}" &>/dev/null; then
        echo "✓ Instance profile already exists: ${PROFILE_NAME}"
      else
        echo "Creating instance profile..."
        aws iam create-instance-profile --instance-profile-name "${PROFILE_NAME}"
        aws iam add-role-to-instance-profile \
          --instance-profile-name "${PROFILE_NAME}" \
          --role-name "${ROLE_NAME}"
        
        sleep 10  # Wait for propagation
        echo "✓ Created instance profile: ${PROFILE_NAME}"
      fi
      
      echo "PKR_VAR_iam_instance_profile=${PROFILE_NAME}" > iam.env
  artifacts:
    reports:
      dotenv: iam.env
    expire_in: 90 days
  tags:
    - spel-offline-runner
  rules:
    - if: '$CREATE_INFRASTRUCTURE == "true"'
      when: manual

# Create KMS Key for EBS encryption
infra:kms:
  stage: infra
  script:
    - echo "Creating KMS key for EBS encryption..."
    - export AWS_DEFAULT_REGION="${PKR_VAR_aws_region}"
    
    - |
      KMS_ALIAS="${INFRA_PREFIX}-ebs-key"
      EXISTING_KEY=$(aws kms list-aliases \
        --query "Aliases[?AliasName=='alias/${KMS_ALIAS}'].TargetKeyId" \
        --output text 2>/dev/null || echo "")
      
      if [ -n "$EXISTING_KEY" ] && [ "$EXISTING_KEY" != "None" ]; then
        echo "✓ KMS key already exists: ${EXISTING_KEY}"
        KEY_ID="${EXISTING_KEY}"
      else
        echo "Creating KMS key..."
        
        # Determine partition for GovCloud
        PARTITION="aws"
        [[ "${PKR_VAR_aws_region}" == us-gov-* ]] && PARTITION="aws-us-gov"
        ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
        ROLE_NAME="${INFRA_PREFIX}-packer-builder-role"
        
        # Create key policy
        cat > /tmp/kms-policy.json <<EOF
      {
        "Version": "2012-10-17",
        "Id": "${KMS_ALIAS}-policy",
        "Statement": [
          {
            "Sid": "EnableRootPermissions",
            "Effect": "Allow",
            "Principal": {"AWS": "arn:${PARTITION}:iam::${ACCOUNT_ID}:root"},
            "Action": "kms:*",
            "Resource": "*"
          },
          {
            "Sid": "AllowEC2ForEBS",
            "Effect": "Allow",
            "Principal": {"Service": "ec2.amazonaws.com"},
            "Action": [
              "kms:Encrypt",
              "kms:Decrypt",
              "kms:ReEncrypt*",
              "kms:GenerateDataKey*",
              "kms:DescribeKey",
              "kms:CreateGrant"
            ],
            "Resource": "*",
            "Condition": {
              "StringEquals": {
                "kms:CallerAccount": "${ACCOUNT_ID}",
                "kms:ViaService": "ec2.${PKR_VAR_aws_region}.amazonaws.com"
              }
            }
          },
          {
            "Sid": "AllowPackerRole",
            "Effect": "Allow",
            "Principal": {"AWS": "arn:${PARTITION}:iam::${ACCOUNT_ID}:role/${ROLE_NAME}"},
            "Action": [
              "kms:Encrypt",
              "kms:Decrypt",
              "kms:ReEncrypt*",
              "kms:GenerateDataKey*",
              "kms:DescribeKey",
              "kms:CreateGrant",
              "kms:ListGrants",
              "kms:RevokeGrant"
            ],
            "Resource": "*"
          }
        ]
      }
      EOF
        
        KEY_ID=$(aws kms create-key \
          --description "SPEL EBS encryption key for Packer builds" \
          --policy file:///tmp/kms-policy.json \
          --tags TagKey=Name,TagValue="${KMS_ALIAS}" TagKey=Project,TagValue=SPEL TagKey=Environment,TagValue=Offline \
          --query 'KeyMetadata.KeyId' --output text)
        
        aws kms create-alias --alias-name "alias/${KMS_ALIAS}" --target-key-id "${KEY_ID}"
        aws kms enable-key-rotation --key-id "${KEY_ID}"
        
        echo "✓ Created KMS key: ${KEY_ID} with automatic rotation enabled"
      fi
      
      KMS_KEY_ARN=$(aws kms describe-key --key-id "${KEY_ID}" --query 'KeyMetadata.Arn' --output text)
      echo "PKR_VAR_aws_kms_key_id=${KMS_KEY_ARN}" > kms.env
      echo "✓ KMS Key ARN: ${KMS_KEY_ARN}"
  artifacts:
    reports:
      dotenv: kms.env
    expire_in: 90 days
  tags:
    - spel-offline-runner
  rules:
    - if: '$CREATE_INFRASTRUCTURE == "true"'
      when: manual

#############################################################################
# Build Stage - Build AMIs using Docker Container
#############################################################################

# Build template using Docker container
.build_template: &build_definition
  stage: build
  needs:
    - job: import:docker
      optional: true
  timeout: 6 hours
  before_script:
    - echo "Starting Docker-based build on $(hostname)"
    - echo "Git commit - ${CI_COMMIT_SHA}"
    
    # Create temporary infrastructure if requested
    - |
      if [ "${CREATE_TEMP_INFRA:-false}" = "true" ]; then
        echo "=== Creating Temporary Infrastructure ==="
        
        TEMP_INFRA_PREFIX="spel-temp-${CI_PIPELINE_ID}"
        VPC_CIDR="10.$((CI_PIPELINE_ID % 100)).0.0/16"
        SUBNET_CIDR="10.$((CI_PIPELINE_ID % 100)).1.0/24"
        CREATED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        
        # Save prefix for after_script cleanup
        echo "TEMP_INFRA_PREFIX=${TEMP_INFRA_PREFIX}" > temp_infra.env
        
        # Create VPC
        echo "Creating VPC..."
        TEMP_VPC_ID=$(aws ec2 create-vpc \
          --cidr-block "${VPC_CIDR}" \
          --query 'Vpc.VpcId' --output text)
        
        aws ec2 create-tags --resources "${TEMP_VPC_ID}" \
          --tags Key=Name,Value="${TEMP_INFRA_PREFIX}-vpc" \
                 Key=Project,Value=SPEL \
                 Key=TempBuild,Value=true \
                 Key=GitLabPipelineId,Value="${CI_PIPELINE_ID}" \
                 Key=CreatedAt,Value="${CREATED_AT}"
        
        aws ec2 modify-vpc-attribute --vpc-id "${TEMP_VPC_ID}" --enable-dns-hostnames
        aws ec2 modify-vpc-attribute --vpc-id "${TEMP_VPC_ID}" --enable-dns-support
        echo "✓ Created VPC: ${TEMP_VPC_ID}"
        echo "TEMP_VPC_ID=${TEMP_VPC_ID}" >> temp_infra.env
        
        # Create Subnet
        echo "Creating subnet..."
        AZ=$(aws ec2 describe-availability-zones --query 'AvailabilityZones[0].ZoneName' --output text)
        TEMP_SUBNET_ID=$(aws ec2 create-subnet \
          --vpc-id "${TEMP_VPC_ID}" \
          --cidr-block "${SUBNET_CIDR}" \
          --availability-zone "${AZ}" \
          --query 'Subnet.SubnetId' --output text)
        
        aws ec2 create-tags --resources "${TEMP_SUBNET_ID}" \
          --tags Key=Name,Value="${TEMP_INFRA_PREFIX}-subnet" \
                 Key=Project,Value=SPEL \
                 Key=TempBuild,Value=true \
                 Key=GitLabPipelineId,Value="${CI_PIPELINE_ID}" \
                 Key=CreatedAt,Value="${CREATED_AT}"
        
        aws ec2 modify-subnet-attribute --subnet-id "${TEMP_SUBNET_ID}" --map-public-ip-on-launch
        echo "✓ Created subnet: ${TEMP_SUBNET_ID}"
        echo "TEMP_SUBNET_ID=${TEMP_SUBNET_ID}" >> temp_infra.env
        
        # Create Internet Gateway
        echo "Creating Internet Gateway..."
        TEMP_IGW_ID=$(aws ec2 create-internet-gateway \
          --query 'InternetGateway.InternetGatewayId' --output text)
        
        aws ec2 create-tags --resources "${TEMP_IGW_ID}" \
          --tags Key=Name,Value="${TEMP_INFRA_PREFIX}-igw" \
                 Key=Project,Value=SPEL \
                 Key=TempBuild,Value=true \
                 Key=GitLabPipelineId,Value="${CI_PIPELINE_ID}" \
                 Key=CreatedAt,Value="${CREATED_AT}"
        
        aws ec2 attach-internet-gateway --internet-gateway-id "${TEMP_IGW_ID}" --vpc-id "${TEMP_VPC_ID}"
        echo "✓ Created and attached Internet Gateway: ${TEMP_IGW_ID}"
        
        # Add default route
        RT_ID=$(aws ec2 describe-route-tables \
          --filters "Name=vpc-id,Values=${TEMP_VPC_ID}" "Name=association.main,Values=true" \
          --query 'RouteTables[0].RouteTableId' --output text)
        
        aws ec2 create-route \
          --route-table-id "${RT_ID}" \
          --destination-cidr-block "0.0.0.0/0" \
          --gateway-id "${TEMP_IGW_ID}" || true
        echo "✓ Added default route"
        
        # Create Security Group
        echo "Creating security group..."
        TEMP_SG_ID=$(aws ec2 create-security-group \
          --group-name "${TEMP_INFRA_PREFIX}-packer-sg" \
          --description "Temporary security group for SPEL Packer build ${CI_PIPELINE_ID}" \
          --vpc-id "${TEMP_VPC_ID}" \
          --query 'GroupId' --output text)
        
        aws ec2 create-tags --resources "${TEMP_SG_ID}" \
          --tags Key=Name,Value="${TEMP_INFRA_PREFIX}-packer-sg" \
                 Key=Project,Value=SPEL \
                 Key=TempBuild,Value=true \
                 Key=GitLabPipelineId,Value="${CI_PIPELINE_ID}" \
                 Key=CreatedAt,Value="${CREATED_AT}"
        
        # Allow SSH and WinRM from VPC CIDR
        aws ec2 authorize-security-group-ingress --group-id "${TEMP_SG_ID}" --protocol tcp --port 22 --cidr "${VPC_CIDR}"
        aws ec2 authorize-security-group-ingress --group-id "${TEMP_SG_ID}" --protocol tcp --port 5986 --cidr "${VPC_CIDR}"
        echo "✓ Created security group: ${TEMP_SG_ID}"
        echo "TEMP_SG_ID=${TEMP_SG_ID}" >> temp_infra.env
        
        # Create IAM Role
        TEMP_ROLE_NAME="${TEMP_INFRA_PREFIX}-role"
        echo "Creating IAM role: ${TEMP_ROLE_NAME}"
        
        cat > /tmp/trust-policy.json <<'TRUSTEOF'
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {"Service": "ec2.amazonaws.com"},
              "Action": "sts:AssumeRole"
            }
          ]
        }
        TRUSTEOF
        
        aws iam create-role \
          --role-name "${TEMP_ROLE_NAME}" \
          --assume-role-policy-document file:///tmp/trust-policy.json \
          --description "Temporary role for SPEL Packer build ${CI_PIPELINE_ID}" \
          --max-session-duration 21600 \
          --tags Key=Project,Value=SPEL Key=TempBuild,Value=true Key=GitLabPipelineId,Value="${CI_PIPELINE_ID}" Key=CreatedAt,Value="${CREATED_AT}"
        echo "✓ Created IAM role"
        echo "TEMP_ROLE_NAME=${TEMP_ROLE_NAME}" >> temp_infra.env
        
        # Create IAM Policy
        TEMP_POLICY_NAME="${TEMP_INFRA_PREFIX}-policy"
        echo "Creating IAM policy: ${TEMP_POLICY_NAME}"
        
        cat > /tmp/packer-policy.json <<'POLICYEOF'
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "SSMAccess",
              "Effect": "Allow",
              "Action": [
                "ssm:UpdateInstanceInformation",
                "ssmmessages:CreateControlChannel",
                "ssmmessages:CreateDataChannel",
                "ssmmessages:OpenControlChannel",
                "ssmmessages:OpenDataChannel",
                "ec2messages:AcknowledgeMessage",
                "ec2messages:DeleteMessage",
                "ec2messages:FailMessage",
                "ec2messages:GetEndpoint",
                "ec2messages:GetMessages",
                "ec2messages:SendReply"
              ],
              "Resource": "*"
            },
            {
              "Sid": "S3Access",
              "Effect": "Allow",
              "Action": ["s3:GetObject", "s3:ListBucket"],
              "Resource": [
                "arn:*:s3:::aws-ssm-*/*",
                "arn:*:s3:::aws-ssm-*",
                "arn:*:s3:::amazon-ssm-*/*",
                "arn:*:s3:::amazon-ssm-*"
              ]
            },
            {
              "Sid": "CloudWatchLogs",
              "Effect": "Allow",
              "Action": [
                "logs:CreateLogStream",
                "logs:PutLogEvents",
                "logs:DescribeLogGroups",
                "logs:DescribeLogStreams"
              ],
              "Resource": "*"
            }
          ]
        }
        POLICYEOF
        
        TEMP_POLICY_ARN=$(aws iam create-policy \
          --policy-name "${TEMP_POLICY_NAME}" \
          --policy-document file:///tmp/packer-policy.json \
          --description "Temporary policy for SPEL Packer build ${CI_PIPELINE_ID}" \
          --tags Key=Project,Value=SPEL Key=TempBuild,Value=true Key=GitLabPipelineId,Value="${CI_PIPELINE_ID}" Key=CreatedAt,Value="${CREATED_AT}" \
          --query 'Policy.Arn' --output text)
        echo "✓ Created IAM policy: ${TEMP_POLICY_ARN}"
        echo "TEMP_POLICY_ARN=${TEMP_POLICY_ARN}" >> temp_infra.env
        
        # Attach policy to role
        aws iam attach-role-policy --role-name "${TEMP_ROLE_NAME}" --policy-arn "${TEMP_POLICY_ARN}"
        echo "✓ Attached policy to role"
        
        # Create Instance Profile
        TEMP_PROFILE_NAME="${TEMP_INFRA_PREFIX}-profile"
        echo "Creating instance profile: ${TEMP_PROFILE_NAME}"
        
        aws iam create-instance-profile --instance-profile-name "${TEMP_PROFILE_NAME}" \
          --tags Key=Project,Value=SPEL Key=TempBuild,Value=true Key=GitLabPipelineId,Value="${CI_PIPELINE_ID}" Key=CreatedAt,Value="${CREATED_AT}"
        
        aws iam add-role-to-instance-profile \
          --instance-profile-name "${TEMP_PROFILE_NAME}" \
          --role-name "${TEMP_ROLE_NAME}"
        echo "✓ Created instance profile"
        echo "TEMP_PROFILE_NAME=${TEMP_PROFILE_NAME}" >> temp_infra.env
        
        # Wait for IAM propagation (critical for AWS consistency)
        echo "Waiting 15 seconds for IAM propagation..."
        sleep 15
        echo "✓ IAM propagation wait complete"
        
        # Check for existing shared KMS key (reuse across temp builds)
        KMS_ALIAS="spel-temp-ebs-key"
        EXISTING_KEY=$(aws kms list-aliases \
          --query "Aliases[?AliasName=='alias/${KMS_ALIAS}'].TargetKeyId" \
          --output text 2>/dev/null || echo "")
        
        if [ -n "$EXISTING_KEY" ] && [ "$EXISTING_KEY" != "None" ]; then
          echo "✓ Reusing existing shared KMS key: ${EXISTING_KEY}"
          KEY_ID="${EXISTING_KEY}"
        else
          echo "Creating shared KMS key for temp builds..."
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          CALLER_ARN=$(aws sts get-caller-identity --query Arn --output text)
          # Extract the role name from the caller ARN (handles assumed-role format)
          CALLER_ROLE_ARN=$(echo "${CALLER_ARN}" | sed 's|:assumed-role/|:role/|; s|/[^/]*$||')
          PARTITION="aws"
          [[ "${PKR_VAR_aws_region}" == us-gov-* ]] && PARTITION="aws-us-gov"
          
          cat > /tmp/kms-policy.json <<KMSEOF
        {
          "Version": "2012-10-17",
          "Id": "${KMS_ALIAS}-policy",
          "Statement": [
            {
              "Sid": "EnableRootPermissions",
              "Effect": "Allow",
              "Principal": {"AWS": "arn:${PARTITION}:iam::${ACCOUNT_ID}:root"},
              "Action": "kms:*",
              "Resource": "*"
            },
            {
              "Sid": "AllowCallerRole",
              "Effect": "Allow",
              "Principal": {"AWS": "${CALLER_ROLE_ARN}"},
              "Action": [
                "kms:Create*",
                "kms:Describe*",
                "kms:Enable*",
                "kms:List*",
                "kms:Put*",
                "kms:Update*",
                "kms:Revoke*",
                "kms:Disable*",
                "kms:Get*",
                "kms:Delete*",
                "kms:TagResource",
                "kms:UntagResource",
                "kms:ScheduleKeyDeletion",
                "kms:CancelKeyDeletion",
                "kms:Encrypt",
                "kms:Decrypt",
                "kms:ReEncrypt*",
                "kms:GenerateDataKey*",
                "kms:CreateGrant"
              ],
              "Resource": "*"
            },
            {
              "Sid": "AllowEC2ForEBS",
              "Effect": "Allow",
              "Principal": {"Service": "ec2.amazonaws.com"},
              "Action": ["kms:Encrypt", "kms:Decrypt", "kms:ReEncrypt*", "kms:GenerateDataKey*", "kms:DescribeKey", "kms:CreateGrant"],
              "Resource": "*",
              "Condition": {"StringEquals": {"kms:CallerAccount": "${ACCOUNT_ID}", "kms:ViaService": "ec2.${PKR_VAR_aws_region}.amazonaws.com"}}
            }
          ]
        }
        KMSEOF
          
          KEY_ID=$(aws kms create-key \
            --description "Shared SPEL EBS encryption key for temp Packer builds" \
            --policy file:///tmp/kms-policy.json \
            --tags TagKey=Name,TagValue="${KMS_ALIAS}" TagKey=Project,TagValue=SPEL TagKey=SharedTempKey,TagValue=true \
            --query 'KeyMetadata.KeyId' --output text)
          
          aws kms create-alias --alias-name "alias/${KMS_ALIAS}" --target-key-id "${KEY_ID}"
          aws kms enable-key-rotation --key-id "${KEY_ID}"
          echo "✓ Created shared KMS key: ${KEY_ID}"
        fi
        
        TEMP_KMS_KEY_ARN=$(aws kms describe-key --key-id "${KEY_ID}" --query 'KeyMetadata.Arn' --output text)
        echo "TEMP_KMS_KEY_ARN=${TEMP_KMS_KEY_ARN}" >> temp_infra.env
        
        # Export for use in build
        export PKR_VAR_aws_vpc_id="${TEMP_VPC_ID}"
        export PKR_VAR_aws_subnet_id="${TEMP_SUBNET_ID}"
        export PKR_VAR_aws_security_group_id="${TEMP_SG_ID}"
        export PKR_VAR_aws_iam_instance_profile="${TEMP_PROFILE_NAME}"
        export PKR_VAR_aws_kms_key_id="${TEMP_KMS_KEY_ARN}"
        
        echo ""
        echo "=== Temporary Infrastructure Created ==="
        echo "VPC: ${TEMP_VPC_ID}"
        echo "Subnet: ${TEMP_SUBNET_ID}"
        echo "Security Group: ${TEMP_SG_ID}"
        echo "Instance Profile: ${TEMP_PROFILE_NAME}"
        echo "KMS Key: ${TEMP_KMS_KEY_ARN}"
      fi
    
    # Verify Docker image is available
    - |
      # Get image tag from import job or find from local images
      if [ -n "${DOCKER_IMAGE_TAG}" ]; then
        IMAGE_TAG="${DOCKER_IMAGE_TAG}"
      else
        # Try to find the latest spel-builder image
        IMAGE_TAG=$(docker images spel-builder --format '{{.Tag}}' | grep -v latest | sort -r | head -1)
        if [ -z "$IMAGE_TAG" ]; then
          echo "ERROR: No spel-builder Docker image found!"
          echo "Run the import:docker job first, or import manually:"
          echo "  gunzip -c spel-builder-*.tar.gz | docker load"
          exit 1
        fi
      fi
      
      echo "Using Docker image: spel-builder:${IMAGE_TAG}"
      docker images "spel-builder:${IMAGE_TAG}"
    
    # Load infrastructure config if available (from infra stage or temp infra)
    - |
      for envfile in network.env sg.env iam.env kms.env temp_infra.env; do
        if [ -f "$envfile" ]; then
          echo "Loading ${envfile}..."
          source "$envfile"
        fi
      done
  script:
    - |
      echo "=== Starting SPEL Build ==="
      echo "Docker Image: spel-builder:${IMAGE_TAG}"
      echo "SPEL_BUILDERS: ${SPEL_BUILDERS:-not set}"
      echo "WINDOWS_BUILDERS: ${WINDOWS_BUILDERS:-not set}"
      echo ""
      
      # Show image details for audit trail
      echo "=== Docker Image Details (for audit) ==="
      docker inspect "spel-builder:${IMAGE_TAG}" --format='Image ID: {{.Id}}'
      docker inspect "spel-builder:${IMAGE_TAG}" --format='Created: {{.Created}}'
      echo "========================================="
      echo ""
    
    # Run build in Docker container
    # Build Docker environment arguments - list-type PKR_VAR variables must only be
    # set when non-empty, otherwise Packer fails with "Missing expression" error
    - |
      DOCKER_ENV_ARGS=(
        -e "AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}"
        -e "AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}"
        -e "AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}"
        -e "AWS_DEFAULT_REGION=${PKR_VAR_aws_region}"
        -e "SPEL_IDENTIFIER=${SPEL_IDENTIFIER}"
        -e "SPEL_VERSION=${CI_COMMIT_TAG:-$(date +%Y.%m).1}"
        -e "SPEL_BUILDERS=${SPEL_BUILDERS:-}"
        -e "WINDOWS_BUILDERS=${WINDOWS_BUILDERS:-}"
        -e "PKR_VAR_aws_region=${PKR_VAR_aws_region}"
        -e "PKR_VAR_aws_force_deregister=${PKR_VAR_aws_force_deregister:-true}"
        -e "PKR_VAR_aws_ami_regions=${PKR_VAR_aws_ami_regions:-[\"${PKR_VAR_aws_region}\"]}"
        -e "PKR_VAR_aws_ami_groups=${PKR_VAR_aws_ami_groups:-[]}"
        -e "PKR_VAR_aws_vpc_id=${PKR_VAR_aws_vpc_id:-}"
        -e "PKR_VAR_aws_subnet_id=${PKR_VAR_aws_subnet_id:-}"
        -e "PKR_VAR_iam_instance_profile=${PKR_VAR_iam_instance_profile:-}"
        -e "PKR_VAR_amigen_repo_mirror_baseurl=${REPO_MIRROR_BASEURL:-}"
        -e "PACKER_LOG=1"
        -e "CHECKPOINT_DISABLE=1"
      )
      
      # Add boolean variables only when non-default
      [[ "${AMIGEN_CROSS_DISTRO:-false}" != "false" ]] && \
        DOCKER_ENV_ARGS+=(-e "PKR_VAR_amigen_cross_distro=${AMIGEN_CROSS_DISTRO}")
      [[ "${AMIGEN_USE_DEFAULT_REPOS:-true}" != "true" ]] && \
        DOCKER_ENV_ARGS+=(-e "PKR_VAR_amigen_use_default_repos=${AMIGEN_USE_DEFAULT_REPOS}")
      [[ "${AMIGEN_REPO_NOSIGNATURE:-false}" != "false" ]] && \
        DOCKER_ENV_ARGS+=(-e "PKR_VAR_amigen_repo_nosignature=${AMIGEN_REPO_NOSIGNATURE}")
      [[ "${AMIGEN_SSLVERIFY_DISABLE:-false}" != "false" ]] && \
        DOCKER_ENV_ARGS+=(-e "PKR_VAR_amigen_sslverify_disable=${AMIGEN_SSLVERIFY_DISABLE}")
      
      # Add list-type variables only when non-empty (empty strings cause Packer HCL parse errors)
      [[ -n "${AMIGEN8_REPO_NAMES:-}" ]] && \
        DOCKER_ENV_ARGS+=(-e "PKR_VAR_amigen8_repo_names=${AMIGEN8_REPO_NAMES}")
      [[ -n "${AMIGEN9_REPO_NAMES:-}" ]] && \
        DOCKER_ENV_ARGS+=(-e "PKR_VAR_amigen9_repo_names=${AMIGEN9_REPO_NAMES}")
      [[ -n "${AMIGEN8_REPO_SOURCES:-}" ]] && \
        DOCKER_ENV_ARGS+=(-e "PKR_VAR_amigen8_repo_sources=${AMIGEN8_REPO_SOURCES}")
      [[ -n "${AMIGEN9_REPO_SOURCES:-}" ]] && \
        DOCKER_ENV_ARGS+=(-e "PKR_VAR_amigen9_repo_sources=${AMIGEN9_REPO_SOURCES}")
      [[ -n "${AMIGEN8_EXTRA_RPMS:-}" ]] && \
        DOCKER_ENV_ARGS+=(-e "PKR_VAR_amigen8_extra_rpms=${AMIGEN8_EXTRA_RPMS}")
      [[ -n "${AMIGEN9_EXTRA_RPMS:-}" ]] && \
        DOCKER_ENV_ARGS+=(-e "PKR_VAR_amigen9_extra_rpms=${AMIGEN9_EXTRA_RPMS}")
      
      # Add KMS key if set
      [[ -n "${PKR_VAR_aws_kms_key_id:-}" ]] && \
        DOCKER_ENV_ARGS+=(-e "PKR_VAR_aws_kms_key_id=${PKR_VAR_aws_kms_key_id}")
      
      # Add IAM instance profile if set
      [[ -n "${PKR_VAR_aws_iam_instance_profile:-}" ]] && \
        DOCKER_ENV_ARGS+=(-e "PKR_VAR_aws_iam_instance_profile=${PKR_VAR_aws_iam_instance_profile}")
      
      docker run --rm \
        -v "${CI_PROJECT_DIR}:/workspace" \
        "${DOCKER_ENV_ARGS[@]}" \
        "spel-builder:${IMAGE_TAG}" \
        make -f Makefile.spel build
  after_script:
    # Cleanup temporary infrastructure (runs even if build fails)
    - |
      if [ -f "temp_infra.env" ]; then
        echo "=== Destroying Temporary Infrastructure ==="
        source temp_infra.env
        
        if [ -z "${TEMP_VPC_ID}" ]; then
          echo "No temporary infrastructure to clean up"
          exit 0
        fi
        
        echo "Cleaning up resources for prefix: ${TEMP_INFRA_PREFIX}"
        
        # Delete Instance Profile
        if [ -n "${TEMP_PROFILE_NAME}" ] && aws iam get-instance-profile --instance-profile-name "${TEMP_PROFILE_NAME}" &>/dev/null; then
          echo "Removing role from instance profile..."
          aws iam remove-role-from-instance-profile \
            --instance-profile-name "${TEMP_PROFILE_NAME}" \
            --role-name "${TEMP_ROLE_NAME}" 2>/dev/null || true
          echo "Deleting instance profile: ${TEMP_PROFILE_NAME}"
          aws iam delete-instance-profile --instance-profile-name "${TEMP_PROFILE_NAME}" || true
          echo "✓ Deleted instance profile"
        fi
        
        # Detach and delete IAM Policy
        if [ -n "${TEMP_POLICY_ARN}" ]; then
          echo "Detaching policy from role..."
          aws iam detach-role-policy \
            --role-name "${TEMP_ROLE_NAME}" \
            --policy-arn "${TEMP_POLICY_ARN}" 2>/dev/null || true
          echo "Deleting policy: ${TEMP_POLICY_ARN}"
          aws iam delete-policy --policy-arn "${TEMP_POLICY_ARN}" || true
          echo "✓ Deleted IAM policy"
        fi
        
        # Delete IAM Role
        if [ -n "${TEMP_ROLE_NAME}" ] && aws iam get-role --role-name "${TEMP_ROLE_NAME}" &>/dev/null; then
          echo "Deleting IAM role: ${TEMP_ROLE_NAME}"
          aws iam delete-role --role-name "${TEMP_ROLE_NAME}" || true
          echo "✓ Deleted IAM role"
        fi
        
        # Delete Security Group (retry for instance termination)
        if [ -n "${TEMP_SG_ID}" ]; then
          echo "Deleting security group: ${TEMP_SG_ID}"
          for i in 1 2 3 4 5; do
            if aws ec2 delete-security-group --group-id "${TEMP_SG_ID}" 2>/dev/null; then
              echo "✓ Deleted security group"
              break
            fi
            echo "Waiting for instances to terminate... (attempt $i/5)"
            sleep 30
          done
        fi
        
        # Delete Subnet
        if [ -n "${TEMP_SUBNET_ID}" ]; then
          echo "Deleting subnet: ${TEMP_SUBNET_ID}"
          aws ec2 delete-subnet --subnet-id "${TEMP_SUBNET_ID}" || true
          echo "✓ Deleted subnet"
        fi
        
        # Detach and delete Internet Gateway
        IGW_ID=$(aws ec2 describe-internet-gateways \
          --filters "Name=tag:Name,Values=${TEMP_INFRA_PREFIX}-igw" \
          --query 'InternetGateways[0].InternetGatewayId' --output text 2>/dev/null || echo "None")
        
        if [ "$IGW_ID" != "None" ] && [ -n "$IGW_ID" ]; then
          echo "Detaching Internet Gateway: ${IGW_ID}"
          aws ec2 detach-internet-gateway --internet-gateway-id "${IGW_ID}" --vpc-id "${TEMP_VPC_ID}" 2>/dev/null || true
          echo "Deleting Internet Gateway: ${IGW_ID}"
          aws ec2 delete-internet-gateway --internet-gateway-id "${IGW_ID}" || true
          echo "✓ Deleted Internet Gateway"
        fi
        
        # Delete VPC
        echo "Deleting VPC: ${TEMP_VPC_ID}"
        aws ec2 delete-vpc --vpc-id "${TEMP_VPC_ID}" || true
        echo "✓ Deleted VPC"
        
        # NOTE: KMS key is NOT deleted - it's a shared key reused across temp builds
        echo ""
        echo "=== Temporary Infrastructure Destroyed ==="
        echo "Note: Shared KMS key (alias/spel-temp-ebs-key) was NOT deleted for reuse"
      fi
  artifacts:
    paths:
      - .spel/
    expire_in: 30 days
  tags:
    - spel-offline-runner
  rules:
    - when: manual

# Individual build jobs
build:amzn2023:
  <<: *build_definition
  variables:
    SPEL_BUILDERS: "amazon-ebssurrogate.minimal-amzn-2023-hvm"

build:ol9:
  <<: *build_definition
  variables:
    SPEL_BUILDERS: "amazon-ebssurrogate.minimal-ol-9-hvm"

build:rhel9:
  <<: *build_definition
  variables:
    SPEL_BUILDERS: "amazon-ebssurrogate.minimal-rhel-9-hvm"

build:ol8:
  <<: *build_definition
  variables:
    SPEL_BUILDERS: "amazon-ebssurrogate.minimal-ol-8-hvm"

build:rhel8:
  <<: *build_definition
  variables:
    SPEL_BUILDERS: "amazon-ebssurrogate.minimal-rhel-8-hvm"

build:windows2016:
  <<: *build_definition
  variables:
    WINDOWS_BUILDERS: "amazon-ebs.hardened-windows-2016-hvm"

build:windows2019:
  <<: *build_definition
  variables:
    WINDOWS_BUILDERS: "amazon-ebs.hardened-windows-2019-hvm"

build:windows2022:
  <<: *build_definition
  variables:
    WINDOWS_BUILDERS: "amazon-ebs.hardened-windows-2022-hvm"

# Full build job (all builders) - runs on tagged releases
build:all:
  <<: *build_definition
  variables:
    SPEL_BUILDERS: "amazon-ebssurrogate.minimal-amzn-2023-hvm,amazon-ebssurrogate.minimal-ol-9-hvm,amazon-ebssurrogate.minimal-rhel-9-hvm,amazon-ebssurrogate.minimal-ol-8-hvm,amazon-ebssurrogate.minimal-rhel-8-hvm"
    WINDOWS_BUILDERS: "amazon-ebs.hardened-windows-2016-hvm,amazon-ebs.hardened-windows-2019-hvm,amazon-ebs.hardened-windows-2022-hvm"
  rules:
    - if: '$CI_COMMIT_TAG'
      when: on_success
    - when: manual
