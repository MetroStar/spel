# =============================================================================
# GitLab CI/CD Configuration for SPEL Offline Builds (Docker-based)
# =============================================================================
# This pipeline builds STIGed AMIs using a pre-built Docker container.
# The container has all dependencies baked in for air-gapped environments.
#
# PREREQUISITES:
#   1. Docker image tarball must be transferred to $DOCKER_IMAGE_PATH
#      - Build using GitHub Actions: offline-prepare.yml
#      - Export: docker save spel-builder:TAG | gzip > spel-builder-TAG.tar.gz
#      - Transfer to runner's accessible location
#
#   2. GitLab Runner must have Docker installed and running
#
#   3. CI/CD Variables required:
#      - AWS_GOVCLOUD_ACCESS_KEY_ID
#      - AWS_GOVCLOUD_SECRET_ACCESS_KEY
#      - DOCKER_IMAGE_PATH (path to spel-builder-*.tar.gz)
#
# PIPELINE STAGES:
#   1. import - Import Docker image from tarball
#   2. infra  - Create AWS infrastructure (optional, one-time setup)
#   3. build  - Build AMIs using Docker container
# =============================================================================

variables:
  SPEL_OFFLINE_MODE: "true"
  SPEL_IDENTIFIER: "spel"
  PKR_VAR_aws_region: "us-gov-east-1"
  PACKER_LOG: "1"
  CHECKPOINT_DISABLE: "1"
  # Infrastructure naming
  INFRA_PREFIX: "spel-offline"
  # Docker image location (must be transferred to this path)
  DOCKER_IMAGE_PATH: "/transfer/spel-builder-*.tar.gz"

stages:
  - import       # Import Docker image from tarball
  - infra        # Create AWS infrastructure (optional one-time setup)
  - build        # Build AMIs

# Default settings for all jobs
default:
  before_script:
    - echo "Starting job on $(hostname)"
    - echo "Git commit - ${CI_COMMIT_SHA}"

#############################################################################
# Import Stage - Import Docker Image from Tarball
#############################################################################

import:docker:
  stage: import
  script:
    - echo "=== Importing Docker Image ==="
    - echo ""
    
    # Find the Docker image tarball
    - |
      TARBALL=$(ls -t ${DOCKER_IMAGE_PATH} 2>/dev/null | head -1)
      
      if [ -z "$TARBALL" ]; then
        echo "ERROR: No Docker image tarball found!"
        echo ""
        echo "Expected location: ${DOCKER_IMAGE_PATH}"
        echo ""
        echo "To resolve:"
        echo "  1. Run the offline-prepare.yml workflow in GitHub Actions"
        echo "  2. Download the spel-builder-YYYYMMDD artifact"
        echo "  3. Transfer spel-builder-*.tar.gz to: ${DOCKER_IMAGE_PATH}"
        echo ""
        exit 1
      fi
      
      echo "Found tarball: ${TARBALL}"
      ls -lh "${TARBALL}"
    
    # Verify checksum if available
    - |
      CHECKSUM_FILE="${TARBALL}.sha256"
      if [ -f "$CHECKSUM_FILE" ]; then
        echo ""
        echo "Verifying checksum..."
        # Run checksum from the directory containing the tarball
        TARBALL_DIR=$(dirname "${TARBALL}")
        TARBALL_NAME=$(basename "${TARBALL}")
        pushd "${TARBALL_DIR}" > /dev/null
        if sha256sum -c "${TARBALL_NAME}.sha256"; then
          echo "✓ Checksum verification passed"
        else
          echo "⚠ Checksum verification failed - continuing anyway"
        fi
        popd > /dev/null
      fi
    
    # Import the Docker image
    - |
      echo ""
      echo "Importing Docker image..."
      gunzip -c "${TARBALL}" | docker load
      
      # Extract image tag from tarball name
      IMAGE_TAG=$(basename "${TARBALL}" .tar.gz | sed 's/spel-builder-//')
      echo "DOCKER_IMAGE_TAG=${IMAGE_TAG}" >> import.env
      
      echo ""
      echo "=== Import Complete ==="
      docker images spel-builder
    
    # Verify the image works
    - |
      echo ""
      echo "=== Verifying Docker Image ==="
      docker run --rm "spel-builder:${IMAGE_TAG}" packer version
      docker run --rm "spel-builder:${IMAGE_TAG}" ansible --version | head -3
      docker run --rm "spel-builder:${IMAGE_TAG}" aws --version
    
    # Show image details (for version tracking)
    - |
      echo ""
      echo "=== Docker Image Details ==="
      docker inspect "spel-builder:${IMAGE_TAG}" --format='Image ID: {{.Id}}'
      docker inspect "spel-builder:${IMAGE_TAG}" --format='Created: {{.Created}}'
      docker inspect "spel-builder:${IMAGE_TAG}" --format='Size: {{.Size}} bytes'
      echo ""
      echo "Full image inspect output:"
      docker inspect "spel-builder:${IMAGE_TAG}" | head -50
      echo "==========================="
  artifacts:
    reports:
      dotenv: import.env
    expire_in: 7 days
  tags:
    - spel-offline-runner
  rules:
    - if: '$IMPORT_DOCKER == "true"'
      when: manual
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual

#############################################################################
# Infrastructure Stage - Create AWS Resources (Optional One-Time Setup)
#############################################################################

# Create or verify VPC and networking
infra:network:
  stage: infra
  script:
    - echo "Setting up AWS network infrastructure..."
    - export AWS_ACCESS_KEY_ID="${AWS_GOVCLOUD_ACCESS_KEY_ID}"
    - export AWS_SECRET_ACCESS_KEY="${AWS_GOVCLOUD_SECRET_ACCESS_KEY}"
    - export AWS_DEFAULT_REGION="${PKR_VAR_aws_region}"
    
    # Check if VPC already exists
    - |
      VPC_NAME="${INFRA_PREFIX}-vpc"
      EXISTING_VPC=$(aws ec2 describe-vpcs \
        --filters "Name=tag:Name,Values=${VPC_NAME}" \
        --query 'Vpcs[0].VpcId' --output text 2>/dev/null || echo "None")
      
      if [ "$EXISTING_VPC" != "None" ] && [ -n "$EXISTING_VPC" ]; then
        echo "✓ VPC already exists: ${EXISTING_VPC}"
        echo "PKR_VAR_aws_vpc_id=${EXISTING_VPC}" > network.env
      else
        echo "Creating VPC..."
        VPC_ID=$(aws ec2 create-vpc \
          --cidr-block 10.0.0.0/16 \
          --query 'Vpc.VpcId' --output text)
        
        aws ec2 create-tags --resources "${VPC_ID}" \
          --tags Key=Name,Value="${VPC_NAME}" Key=Project,Value=SPEL Key=Environment,Value=Offline
        
        aws ec2 modify-vpc-attribute --vpc-id "${VPC_ID}" --enable-dns-hostnames
        aws ec2 modify-vpc-attribute --vpc-id "${VPC_ID}" --enable-dns-support
        
        echo "PKR_VAR_aws_vpc_id=${VPC_ID}" > network.env
        echo "✓ Created VPC: ${VPC_ID}"
      fi
    
    # Create or get subnet
    - |
      source network.env
      SUBNET_NAME="${INFRA_PREFIX}-subnet"
      EXISTING_SUBNET=$(aws ec2 describe-subnets \
        --filters "Name=tag:Name,Values=${SUBNET_NAME}" "Name=vpc-id,Values=${PKR_VAR_aws_vpc_id}" \
        --query 'Subnets[0].SubnetId' --output text 2>/dev/null || echo "None")
      
      if [ "$EXISTING_SUBNET" != "None" ] && [ -n "$EXISTING_SUBNET" ]; then
        echo "✓ Subnet already exists: ${EXISTING_SUBNET}"
        echo "PKR_VAR_aws_subnet_id=${EXISTING_SUBNET}" >> network.env
      else
        echo "Creating subnet..."
        AZ=$(aws ec2 describe-availability-zones --query 'AvailabilityZones[0].ZoneName' --output text)
        SUBNET_ID=$(aws ec2 create-subnet \
          --vpc-id "${PKR_VAR_aws_vpc_id}" \
          --cidr-block 10.0.1.0/24 \
          --availability-zone "${AZ}" \
          --query 'Subnet.SubnetId' --output text)
        
        aws ec2 create-tags --resources "${SUBNET_ID}" \
          --tags Key=Name,Value="${SUBNET_NAME}" Key=Project,Value=SPEL Key=Environment,Value=Offline
        
        aws ec2 modify-subnet-attribute --subnet-id "${SUBNET_ID}" --map-public-ip-on-launch
        
        echo "PKR_VAR_aws_subnet_id=${SUBNET_ID}" >> network.env
        echo "✓ Created subnet: ${SUBNET_ID}"
      fi
    
    - cat network.env
  artifacts:
    reports:
      dotenv: network.env
    expire_in: 90 days
  tags:
    - spel-offline-runner
  rules:
    - if: '$CREATE_INFRASTRUCTURE == "true"'
      when: manual

# Create Security Group
infra:security_group:
  stage: infra
  needs: ["infra:network"]
  script:
    - echo "Creating security group for Packer builders..."
    - export AWS_ACCESS_KEY_ID="${AWS_GOVCLOUD_ACCESS_KEY_ID}"
    - export AWS_SECRET_ACCESS_KEY="${AWS_GOVCLOUD_SECRET_ACCESS_KEY}"
    - export AWS_DEFAULT_REGION="${PKR_VAR_aws_region}"
    
    - |
      SG_NAME="${INFRA_PREFIX}-packer-sg"
      EXISTING_SG=$(aws ec2 describe-security-groups \
        --filters "Name=group-name,Values=${SG_NAME}" "Name=vpc-id,Values=${PKR_VAR_aws_vpc_id}" \
        --query 'SecurityGroups[0].GroupId' --output text 2>/dev/null || echo "None")
      
      if [ "$EXISTING_SG" != "None" ] && [ -n "$EXISTING_SG" ]; then
        echo "✓ Security group already exists: ${EXISTING_SG}"
        echo "PKR_VAR_aws_security_group_id=${EXISTING_SG}" > sg.env
      else
        echo "Creating security group..."
        SG_ID=$(aws ec2 create-security-group \
          --group-name "${SG_NAME}" \
          --description "Security group for SPEL Packer builders" \
          --vpc-id "${PKR_VAR_aws_vpc_id}" \
          --query 'GroupId' --output text)
        
        aws ec2 create-tags --resources "${SG_ID}" \
          --tags Key=Name,Value="${SG_NAME}" Key=Project,Value=SPEL Key=Environment,Value=Offline
        
        # Allow SSH from VPC CIDR
        aws ec2 authorize-security-group-ingress \
          --group-id "${SG_ID}" \
          --protocol tcp --port 22 \
          --cidr 10.0.0.0/16
        
        echo "PKR_VAR_aws_security_group_id=${SG_ID}" > sg.env
        echo "✓ Created security group: ${SG_ID}"
      fi
  artifacts:
    reports:
      dotenv: sg.env
    expire_in: 90 days
  tags:
    - spel-offline-runner
  rules:
    - if: '$CREATE_INFRASTRUCTURE == "true"'
      when: manual

# Create IAM resources
infra:iam:
  stage: infra
  script:
    - echo "Creating IAM role and instance profile for Packer..."
    - export AWS_ACCESS_KEY_ID="${AWS_GOVCLOUD_ACCESS_KEY_ID}"
    - export AWS_SECRET_ACCESS_KEY="${AWS_GOVCLOUD_SECRET_ACCESS_KEY}"
    - export AWS_DEFAULT_REGION="${PKR_VAR_aws_region}"
    
    # Create IAM role
    - |
      ROLE_NAME="${INFRA_PREFIX}-packer-builder-role"
      
      if aws iam get-role --role-name "${ROLE_NAME}" &>/dev/null; then
        echo "✓ IAM role already exists: ${ROLE_NAME}"
      else
        echo "Creating IAM role..."
        cat > trust-policy.json <<'EOF'
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Principal": {
              "Service": "ec2.amazonaws.com"
            },
            "Action": "sts:AssumeRole"
          }
        ]
      }
      EOF
        
        aws iam create-role \
          --role-name "${ROLE_NAME}" \
          --assume-role-policy-document file://trust-policy.json \
          --description "Role for SPEL Packer builders"
        
        echo "✓ Created IAM role: ${ROLE_NAME}"
      fi
    
    # Create instance profile
    - |
      PROFILE_NAME="${INFRA_PREFIX}-packer-builder-profile"
      
      if aws iam get-instance-profile --instance-profile-name "${PROFILE_NAME}" &>/dev/null; then
        echo "✓ Instance profile already exists: ${PROFILE_NAME}"
      else
        echo "Creating instance profile..."
        aws iam create-instance-profile --instance-profile-name "${PROFILE_NAME}"
        aws iam add-role-to-instance-profile \
          --instance-profile-name "${PROFILE_NAME}" \
          --role-name "${ROLE_NAME}"
        
        sleep 10  # Wait for propagation
        echo "✓ Created instance profile: ${PROFILE_NAME}"
      fi
      
      echo "PKR_VAR_iam_instance_profile=${PROFILE_NAME}" > iam.env
  artifacts:
    reports:
      dotenv: iam.env
    expire_in: 90 days
  tags:
    - spel-offline-runner
  rules:
    - if: '$CREATE_INFRASTRUCTURE == "true"'
      when: manual

#############################################################################
# Build Stage - Build AMIs using Docker Container
#############################################################################

# Build template using Docker container
.build_template: &build_definition
  stage: build
  needs:
    - job: import:docker
      optional: true
  timeout: 6 hours
  before_script:
    - echo "Starting Docker-based build on $(hostname)"
    - echo "Git commit - ${CI_COMMIT_SHA}"
    
    # Verify Docker image is available
    - |
      # Get image tag from import job or find from local images
      if [ -n "${DOCKER_IMAGE_TAG}" ]; then
        IMAGE_TAG="${DOCKER_IMAGE_TAG}"
      else
        # Try to find the latest spel-builder image
        IMAGE_TAG=$(docker images spel-builder --format '{{.Tag}}' | grep -v latest | sort -r | head -1)
        if [ -z "$IMAGE_TAG" ]; then
          echo "ERROR: No spel-builder Docker image found!"
          echo "Run the import:docker job first, or import manually:"
          echo "  gunzip -c spel-builder-*.tar.gz | docker load"
          exit 1
        fi
      fi
      
      echo "Using Docker image: spel-builder:${IMAGE_TAG}"
      docker images "spel-builder:${IMAGE_TAG}"
    
    # Load infrastructure config if available
    - |
      for envfile in network.env sg.env iam.env; do
        if [ -f "$envfile" ]; then
          echo "Loading ${envfile}..."
          source "$envfile"
        fi
      done
  script:
    - |
      echo "=== Starting SPEL Build ==="
      echo "Docker Image: spel-builder:${IMAGE_TAG}"
      echo "SPEL_BUILDERS: ${SPEL_BUILDERS:-not set}"
      echo "WINDOWS_BUILDERS: ${WINDOWS_BUILDERS:-not set}"
      echo ""
      
      # Show image details for audit trail
      echo "=== Docker Image Details (for audit) ==="
      docker inspect "spel-builder:${IMAGE_TAG}" --format='Image ID: {{.Id}}'
      docker inspect "spel-builder:${IMAGE_TAG}" --format='Created: {{.Created}}'
      echo "========================================="
      echo ""
    
    # Run build in Docker container
    - |
      docker run --rm \
        -v "${CI_PROJECT_DIR}:/workspace" \
        -e AWS_ACCESS_KEY_ID="${AWS_GOVCLOUD_ACCESS_KEY_ID}" \
        -e AWS_SECRET_ACCESS_KEY="${AWS_GOVCLOUD_SECRET_ACCESS_KEY}" \
        -e AWS_DEFAULT_REGION="${PKR_VAR_aws_region}" \
        -e AWS_REGION="${PKR_VAR_aws_region}" \
        -e SPEL_IDENTIFIER="${SPEL_IDENTIFIER}" \
        -e SPEL_VERSION="${CI_COMMIT_TAG:-$(date +%Y.%m).1}" \
        -e SPEL_BUILDERS="${SPEL_BUILDERS:-}" \
        -e WINDOWS_BUILDERS="${WINDOWS_BUILDERS:-}" \
        -e PKR_VAR_aws_region="${PKR_VAR_aws_region}" \
        -e PKR_VAR_aws_force_deregister="${PKR_VAR_aws_force_deregister:-true}" \
        -e PKR_VAR_aws_ami_regions="${PKR_VAR_aws_ami_regions:-[\"us-gov-east-1\"]}" \
        -e PKR_VAR_aws_ami_groups="${PKR_VAR_aws_ami_groups:-[\"all\"]}" \
        -e PKR_VAR_aws_vpc_id="${PKR_VAR_aws_vpc_id:-}" \
        -e PKR_VAR_aws_subnet_id="${PKR_VAR_aws_subnet_id:-}" \
        -e PKR_VAR_iam_instance_profile="${PKR_VAR_iam_instance_profile:-}" \
        -e PACKER_LOG=1 \
        -e CHECKPOINT_DISABLE=1 \
        "spel-builder:${IMAGE_TAG}" \
        make -f Makefile.spel build
  artifacts:
    paths:
      - .spel/
    expire_in: 30 days
  tags:
    - spel-offline-runner
  rules:
    - when: manual

# Individual build jobs
build:amzn2023:
  <<: *build_definition
  variables:
    SPEL_BUILDERS: "amazon-ebssurrogate.minimal-amzn-2023-hvm"

build:ol9:
  <<: *build_definition
  variables:
    SPEL_BUILDERS: "amazon-ebssurrogate.minimal-ol-9-hvm"

build:rhel9:
  <<: *build_definition
  variables:
    SPEL_BUILDERS: "amazon-ebssurrogate.minimal-rhel-9-hvm"

build:ol8:
  <<: *build_definition
  variables:
    SPEL_BUILDERS: "amazon-ebssurrogate.minimal-ol-8-hvm"

build:rhel8:
  <<: *build_definition
  variables:
    SPEL_BUILDERS: "amazon-ebssurrogate.minimal-rhel-8-hvm"

build:windows2016:
  <<: *build_definition
  variables:
    WINDOWS_BUILDERS: "amazon-ebs.hardened-windows-2016-hvm"

build:windows2019:
  <<: *build_definition
  variables:
    WINDOWS_BUILDERS: "amazon-ebs.hardened-windows-2019-hvm"

build:windows2022:
  <<: *build_definition
  variables:
    WINDOWS_BUILDERS: "amazon-ebs.hardened-windows-2022-hvm"

# Full build job (all builders) - runs on tagged releases
build:all:
  <<: *build_definition
  variables:
    SPEL_BUILDERS: "amazon-ebssurrogate.minimal-amzn-2023-hvm,amazon-ebssurrogate.minimal-ol-9-hvm,amazon-ebssurrogate.minimal-rhel-9-hvm,amazon-ebssurrogate.minimal-ol-8-hvm,amazon-ebssurrogate.minimal-rhel-8-hvm"
    WINDOWS_BUILDERS: "amazon-ebs.hardened-windows-2016-hvm,amazon-ebs.hardened-windows-2019-hvm,amazon-ebs.hardened-windows-2022-hvm"
  rules:
    - if: '$CI_COMMIT_TAG'
      when: on_success
    - when: manual
