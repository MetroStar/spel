# =============================================================================
# Build STIGed AMI's using Docker Container
# =============================================================================
# This workflow builds STIGed AMIs using the pre-built Docker container
# that contains all dependencies baked in.
#
# PREREQUISITES:
#   1. Run the "Prepare Offline Docker Image" workflow first (offline-prepare.yml)
#   2. Download the granite-builder-YYYYMMDD artifact from that workflow
#   3. Provide the artifact name when running this workflow
#   4. IAM role MaxSessionDuration must be >= 21600 (6 hours):
#        aws iam update-role --role-name Packer_Amazon --max-session-duration 21600
#
# INFRASTRUCTURE:
#   Infrastructure is managed by infra-setup.yml via OpenTofu. This workflow
#   automatically calls infra-setup.yml with action=apply before every build.
#   OpenTofu apply is idempotent — it creates infra if missing, no-op if exists.
#
# WORKFLOW:
#   1. infra job: Ensure infrastructure exists (calls infra-setup.yml)
#   2. build job: Download Docker image, import, run Packer builds
# =============================================================================

name: Build STIGed AMI's

on:
  workflow_dispatch:
    inputs:
      docker_image_artifact:
        description: "Docker image artifact name (e.g., granite-builder-20251231)"
        required: true
        type: string
      run_amzn2023:
        description: "Run Amazon Linux 2023 builder"
        required: false
        default: false
        type: boolean
      run_ol9:
        description: "Run Oracle Linux 9 builder"
        required: false
        default: false
        type: boolean
      run_rhel9:
        description: "Run RHEL 9 builder"
        required: false
        default: false
        type: boolean
      run_ol8:
        description: "Run Oracle Linux 8 builder"
        required: false
        default: false
        type: boolean
      run_rhel8:
        description: "Run RHEL 8 builder"
        required: false
        default: false
        type: boolean
      run_ws2016:
        description: "Run Windows Server 2016 builder"
        required: false
        default: false
        type: boolean
      run_ws2019:
        description: "Run Windows Server 2019 builder"
        required: false
        default: false
        type: boolean
      run_ws2022:
        description: "Run Windows Server 2022 builder"
        required: false
        default: false
        type: boolean
      # Air-gapped build configuration
      repo_mirror_baseurl:
        description: "Local YUM mirror URL for air-gapped builds (e.g., http://mirror.internal.mil)"
        required: false
        type: string
        default: ""
      airgap_mode:
        description: "Enable air-gapped build mode (sets cross_distro=true, use_default_repos=false, repo_nosignature=true, sslverify_disable=true)"
        required: false
        type: boolean
        default: false
      amigen8_repo_names:
        description: "Custom repo names for EL8 (JSON array, e.g., [\"rhel-8-baseos\",\"rhel-8-appstream\"])"
        required: false
        type: string
        default: ""
      amigen9_repo_names:
        description: "Custom repo names for EL9 (JSON array, e.g., [\"rhel-9-baseos\",\"rhel-9-appstream\"])"
        required: false
        type: string
        default: ""
      amigen8_repo_sources:
        description: "Repo source RPMs for EL8 (JSON array of URLs)"
        required: false
        type: string
        default: ""
      amigen9_repo_sources:
        description: "Repo source RPMs for EL9 (JSON array of URLs)"
        required: false
        type: string
        default: ""
      amigen8_extra_rpms:
        description: "Extra RPMs for EL8 (JSON array, exclude RHUI packages)"
        required: false
        type: string
        default: ""
      amigen9_extra_rpms:
        description: "Extra RPMs for EL9 (JSON array, exclude RHUI packages)"
        required: false
        type: string
        default: ""
      # Goss audit binary URL for air-gapped builds
      goss_binary_url:
        description: "Goss binary URL for air-gapped STIG auditing (e.g., https://mirror.internal.mil/tools/goss-linux-AMD64)"
        required: false
        type: string
        default: ""
      # Post-build testing
      test_windows_instance_types:
        description: "Test Windows AMIs on multiple Nitro instance types after build (opt-in)"
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: write

jobs:
  # ==========================================================================
  # Infrastructure Job — ensure persistent infra exists via OpenTofu
  # ==========================================================================
  infra:
    name: Ensure Infrastructure
    uses: ./.github/workflows/infra-setup.yml
    with:
      action: apply
      aws_region: us-east-1
      enable_internet_gateway: ${{ !inputs.airgap_mode }}
      enable_packer_endpoints: ${{ inputs.airgap_mode }}
    secrets: inherit

  # ==========================================================================
  # Build Job — build STIGed AMIs using Docker container
  # ==========================================================================
  build:
    name: Build Granite AMI's
    needs: infra
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours for multiple AMI builds

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Download Docker image artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          name: ${{ github.event.inputs.docker_image_artifact }}
          path: ./docker-image/
          workflow: offline-prepare.yml
          workflow_conclusion: success
          search_artifacts: true

      - name: Import Docker image
        run: |
          echo "=== Importing Docker Image ==="
          
          # Decode base64 file if present
          B64_FILE=$(ls ./docker-image/granite-builder-*.tar.gz.b64 2>/dev/null | head -1)
          if [ -n "$B64_FILE" ]; then
            echo "Found base64-encoded file: ${B64_FILE}"
            echo "Decoding base64 tarball..."
            base64 -d "${B64_FILE}" > "${B64_FILE%.b64}"
            echo "Decoded to: ${B64_FILE%.b64}"
          fi
          
          # Find the tarball
          TARBALL=$(ls ./docker-image/granite-builder-*.tar.gz 2>/dev/null | head -1)
          
          if [ -z "$TARBALL" ]; then
            echo "ERROR: No Docker image tarball found in artifact!"
            echo ""
            echo "Expected file: granite-builder-*.tar.gz"
            echo "Artifact contents:"
            ls -la ./docker-image/
            echo ""
            echo "Please ensure the offline-prepare.yml workflow completed successfully"
            echo "and the artifact name '${{ github.event.inputs.docker_image_artifact }}' is correct."
            exit 1
          fi
          
          echo "Found tarball: ${TARBALL}"
          ls -lh "${TARBALL}"
          
          # Verify checksum if available
          CHECKSUM_FILE="${TARBALL}.sha256"
          if [ -f "$CHECKSUM_FILE" ]; then
            echo ""
            echo "Verifying checksum..."
            TARBALL_DIR=$(dirname "${TARBALL}")
            TARBALL_NAME=$(basename "${TARBALL}")
            pushd "${TARBALL_DIR}" > /dev/null
            if sha256sum -c "${TARBALL_NAME}.sha256"; then
              echo "✓ Checksum verification passed"
            else
              echo "WARNING: Checksum verification failed"
            fi
            popd > /dev/null
          fi
          
          # Import the image
          echo ""
          echo "Importing Docker image..."
          gunzip -c "${TARBALL}" | docker load
          
          # Extract the image tag from tarball name
          IMAGE_TAG=$(basename "${TARBALL}" .tar.gz | sed 's/granite-builder-//')
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
          
          echo ""
          echo "=== Import Complete ==="
          docker images granite-builder

      - name: Verify Docker image
        run: |
          echo "=== Docker Image Verification ==="
          
          docker run --rm "granite-builder:${IMAGE_TAG}" packer version
          docker run --rm "granite-builder:${IMAGE_TAG}" ansible --version | head -3
          docker run --rm "granite-builder:${IMAGE_TAG}" aws --version
          
          echo ""
          echo "=== Image Details ==="
          docker inspect "granite-builder:${IMAGE_TAG}" --format='Image ID: {{.Id}}'
          docker inspect "granite-builder:${IMAGE_TAG}" --format='Created: {{.Created}}'
          docker inspect "granite-builder:${IMAGE_TAG}" --format='Size: {{.Size}} bytes'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ vars.AWS_ROLE_ARN || secrets.AWS_ROLE_ARN }}
          role-session-name: granite-build
          role-duration-seconds: 21600  # 6 hours - must be <= IAM role MaxSessionDuration

      - name: Upload STIG playbooks to S3
        if: needs.infra.outputs.s3_bucket_name != ''
        run: |
          echo "=== Uploading STIG Playbooks ==="

          S3_BUCKET="${{ needs.infra.outputs.s3_bucket_name }}"
          echo "Target bucket: ${S3_BUCKET}"
          echo "Extracting roles from granite-builder:${IMAGE_TAG}"

          # Extract Ansible Lockdown roles from the Docker image
          ROLES_DIR="${GITHUB_WORKSPACE}/granite/ansible/roles"
          mkdir -p "$ROLES_DIR"
          CID=$(docker create "granite-builder:${IMAGE_TAG}" /bin/true)
          for ROLE in RHEL8-STIG RHEL9-STIG; do
            docker cp "${CID}:/opt/ansible/roles/${ROLE}" "$ROLES_DIR/" 2>/dev/null && \
              echo "  [OK] Extracted ${ROLE}" || \
              echo "  [WARN] ${ROLE} not found in image"
          done
          docker rm "$CID" > /dev/null

          # Package EL playbooks and upload
          echo ""
          echo "--- Packaging EL STIG playbooks ---"
          mkdir -p "${GITHUB_WORKSPACE}/dist"
          bash "${GITHUB_WORKSPACE}/tests/package-ansible-stig.sh" \
            --output "${GITHUB_WORKSPACE}/dist" \
            --s3-bucket "$S3_BUCKET" \
            --s3-prefix "ansible" \
            --os-target all

          aws s3 cp "${GITHUB_WORKSPACE}/dist/ansible-stig-all-latest.zip" \
            "s3://${S3_BUCKET}/ansible/stig-playbook.zip"
          echo "  [OK] s3://${S3_BUCKET}/ansible/stig-playbook.zip"

          # Package AL2023 STIG script and upload
          echo ""
          echo "--- Packaging AL2023 STIG script ---"
          AL2023_STAGING=$(mktemp -d)
          # Extract the base64-encoded AWS STIG tarball from the Docker image
          CID=$(docker create "granite-builder:${IMAGE_TAG}" /bin/true)
          docker cp "${CID}:/opt/offline-packages/LinuxAWSConfigureSTIG.tgz.b64" "$AL2023_STAGING/" 2>/dev/null && \
            echo "  [OK] Extracted LinuxAWSConfigureSTIG.tgz.b64" || \
            { echo "  [ERROR] LinuxAWSConfigureSTIG.tgz.b64 not found in image"; docker rm "$CID" > /dev/null; exit 1; }
          docker rm "$CID" > /dev/null
          # Decode and extract the STIG script
          base64 -d "$AL2023_STAGING/LinuxAWSConfigureSTIG.tgz.b64" > "$AL2023_STAGING/LinuxAWSConfigureSTIG.tgz"
          tar xzf "$AL2023_STAGING/LinuxAWSConfigureSTIG.tgz" -C "$AL2023_STAGING"
          rm -f "$AL2023_STAGING/LinuxAWSConfigureSTIG.tgz" "$AL2023_STAGING/LinuxAWSConfigureSTIG.tgz.b64"
          # Create wrapper script that the SSM association calls
          printf '%s\n' '#!/bin/bash' \
            'set -eu' \
            'SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"' \
            'if [[ -d "$SCRIPT_DIR/linux_stigs" && -f "$SCRIPT_DIR/linux_stigs/main.sh" ]]; then' \
            '  chmod +x "$SCRIPT_DIR/linux_stigs/main.sh"' \
            '  "$SCRIPT_DIR/linux_stigs/main.sh" -d "$SCRIPT_DIR/linux_stigs/" -l High -h yes -s yes' \
            'else' \
            '  echo "ERROR: linux_stigs/main.sh not found in $SCRIPT_DIR"' \
            '  ls -la "$SCRIPT_DIR/" 2>/dev/null' \
            '  exit 1' \
            'fi' > "$AL2023_STAGING/apply-stig.sh"
          chmod +x "$AL2023_STAGING/apply-stig.sh"
          (cd "$AL2023_STAGING" && zip -qr "${GITHUB_WORKSPACE}/dist/al2023-stig-script.zip" .)
          aws s3 cp "${GITHUB_WORKSPACE}/dist/al2023-stig-script.zip" \
            "s3://${S3_BUCKET}/ansible/al2023-stig-script.zip"
          echo "  [OK] s3://${S3_BUCKET}/ansible/al2023-stig-script.zip"
          rm -rf "$AL2023_STAGING"

          # NOTE: Windows STIG enforcement uses the AWS-managed AWSEC2-ConfigureSTIG
          # SSM document, so no Windows playbook upload to S3 is needed.

          echo ""
          echo "=== Playbook Upload Complete ==="

      - name: Set up environment
        run: |
          echo "=== Setting up Build Environment ==="
          
          echo "GRANITE_IDENTIFIER=granite" >> $GITHUB_ENV
          echo "GRANITE_VERSION=$(date +%Y.%m).1" >> $GITHUB_ENV
          
          # Build builder list from inputs
          builders=""
          if [[ "${{ github.event.inputs.run_amzn2023 }}" == "true" ]]; then
            builders+="amazon-ebssurrogate.minimal-amzn-2023-hvm,"
          fi
          if [[ "${{ github.event.inputs.run_ol9 }}" == "true" ]]; then
            builders+="amazon-ebssurrogate.minimal-ol-9-hvm,"
          fi
          if [[ "${{ github.event.inputs.run_rhel9 }}" == "true" ]]; then
            builders+="amazon-ebssurrogate.minimal-rhel-9-hvm,"
          fi
          if [[ "${{ github.event.inputs.run_ol8 }}" == "true" ]]; then
            builders+="amazon-ebssurrogate.minimal-ol-8-hvm,"
          fi
          if [[ "${{ github.event.inputs.run_rhel8 }}" == "true" ]]; then
            builders+="amazon-ebssurrogate.minimal-rhel-8-hvm,"
          fi
          builders="${builders%,}"
          echo "GRANITE_BUILDERS=${builders}" >> $GITHUB_ENV
          
          # Windows builders
          windows_builders=""
          if [[ "${{ github.event.inputs.run_ws2016 }}" == "true" ]]; then
            windows_builders+="amazon-ebs.hardened-windows-2016-hvm,"
          fi
          if [[ "${{ github.event.inputs.run_ws2019 }}" == "true" ]]; then
            windows_builders+="amazon-ebs.hardened-windows-2019-hvm,"
          fi
          if [[ "${{ github.event.inputs.run_ws2022 }}" == "true" ]]; then
            windows_builders+="amazon-ebs.hardened-windows-2022-hvm,"
          fi
          windows_builders="${windows_builders%,}"
          echo "WINDOWS_BUILDERS=${windows_builders}" >> $GITHUB_ENV
          
          # Packer variables
          echo "PKR_VAR_aws_region=us-east-1" >> $GITHUB_ENV
          echo "PKR_VAR_aws_force_deregister=true" >> $GITHUB_ENV
          # AMIs are private by default - set PKR_VAR_aws_ami_groups='["all"]' to make public
          echo "PKR_VAR_aws_ami_groups=[]" >> $GITHUB_ENV
          
          # Display configuration
          echo ""
          echo "Build Configuration:"
          echo "  GRANITE_BUILDERS: ${builders:-none}"
          echo "  WINDOWS_BUILDERS: ${windows_builders:-none}"
          echo "  GRANITE_VERSION: $(date +%Y.%m).1"
          echo "  Docker Image: granite-builder:${IMAGE_TAG}"

      - name: Build STIGed AMI's
        run: |
          echo "=== Starting Granite Build ==="
          echo "Docker Image: granite-builder:${IMAGE_TAG}"
          echo "Builders: ${GRANITE_BUILDERS}"
          echo "Windows Builders: ${WINDOWS_BUILDERS}"
          echo ""
          
          # Build docker run command with conditional environment variables
          # List-type PKR_VAR variables must not be set to empty string (Packer HCL parsing fails)
          DOCKER_ENV_ARGS=(
            -e AWS_ACCESS_KEY_ID
            -e AWS_SECRET_ACCESS_KEY
            -e AWS_SESSION_TOKEN
            -e AWS_DEFAULT_REGION=us-east-1
            -e GRANITE_IDENTIFIER="${GRANITE_IDENTIFIER}"
            -e GRANITE_VERSION="${GRANITE_VERSION}"
            -e GRANITE_BUILDERS="${GRANITE_BUILDERS}"
            -e WINDOWS_BUILDERS="${WINDOWS_BUILDERS}"
            -e PKR_VAR_aws_region="${PKR_VAR_aws_region}"
            -e PKR_VAR_aws_force_deregister="${PKR_VAR_aws_force_deregister}"
            -e PKR_VAR_aws_ami_regions="${PKR_VAR_aws_ami_regions:-[]}"
            -e PKR_VAR_aws_ami_groups="${PKR_VAR_aws_ami_groups}"
            -e PACKER_LOG=1
            -e CHECKPOINT_DISABLE=1
          )
          
          # Infrastructure outputs from infra job (always available)
          VPC_ID="${{ needs.infra.outputs.vpc_id }}"
          SUBNET_ID="${{ needs.infra.outputs.subnet_id }}"
          SG_ID="${{ needs.infra.outputs.security_group_id }}"
          INSTANCE_PROFILE="${{ needs.infra.outputs.instance_profile }}"
          KMS_KEY_ID="${{ needs.infra.outputs.kms_key_id }}"
          S3_BUCKET="${{ needs.infra.outputs.s3_bucket_name }}"
          
          [[ -n "${VPC_ID}" ]] && DOCKER_ENV_ARGS+=(-e PKR_VAR_aws_vpc_id="${VPC_ID}")
          [[ -n "${SUBNET_ID}" ]] && DOCKER_ENV_ARGS+=(-e PKR_VAR_aws_subnet_id="${SUBNET_ID}")
          [[ -n "${SG_ID}" ]] && DOCKER_ENV_ARGS+=(-e PKR_VAR_aws_security_group_id="${SG_ID}")
          [[ -n "${KMS_KEY_ID}" ]] && DOCKER_ENV_ARGS+=(-e PKR_VAR_aws_kms_key_id="${KMS_KEY_ID}")
          [[ -n "${INSTANCE_PROFILE}" ]] && DOCKER_ENV_ARGS+=(-e PKR_VAR_aws_iam_instance_profile="${INSTANCE_PROFILE}")
          [[ -n "${{ github.event.inputs.repo_mirror_baseurl }}" ]] && DOCKER_ENV_ARGS+=(-e PKR_VAR_amigen_repo_mirror_baseurl="${{ github.event.inputs.repo_mirror_baseurl }}")
          
          # Add air-gapped mode settings (enables all air-gapped flags at once)
          if [[ "${{ github.event.inputs.airgap_mode }}" == "true" ]]; then
            DOCKER_ENV_ARGS+=(-e PKR_VAR_amigen_cross_distro=true)
            DOCKER_ENV_ARGS+=(-e PKR_VAR_amigen_use_default_repos=false)
            DOCKER_ENV_ARGS+=(-e PKR_VAR_amigen_repo_nosignature=true)
            DOCKER_ENV_ARGS+=(-e PKR_VAR_amigen_sslverify_disable=true)
          fi
          
          # Add list variables only if non-empty (empty string causes Packer HCL parse error)
          [[ -n "${{ github.event.inputs.amigen8_repo_names }}" ]] && DOCKER_ENV_ARGS+=(-e "PKR_VAR_amigen8_repo_names=${{ github.event.inputs.amigen8_repo_names }}")
          [[ -n "${{ github.event.inputs.amigen9_repo_names }}" ]] && DOCKER_ENV_ARGS+=(-e "PKR_VAR_amigen9_repo_names=${{ github.event.inputs.amigen9_repo_names }}")
          [[ -n "${{ github.event.inputs.amigen8_repo_sources }}" ]] && DOCKER_ENV_ARGS+=(-e "PKR_VAR_amigen8_repo_sources=${{ github.event.inputs.amigen8_repo_sources }}")
          [[ -n "${{ github.event.inputs.amigen9_repo_sources }}" ]] && DOCKER_ENV_ARGS+=(-e "PKR_VAR_amigen9_repo_sources=${{ github.event.inputs.amigen9_repo_sources }}")
          [[ -n "${{ github.event.inputs.amigen8_extra_rpms }}" ]] && DOCKER_ENV_ARGS+=(-e "PKR_VAR_amigen8_extra_rpms=${{ github.event.inputs.amigen8_extra_rpms }}")
          [[ -n "${{ github.event.inputs.amigen9_extra_rpms }}" ]] && DOCKER_ENV_ARGS+=(-e "PKR_VAR_amigen9_extra_rpms=${{ github.event.inputs.amigen9_extra_rpms }}")
          [[ -n "${{ github.event.inputs.goss_binary_url }}" ]] && DOCKER_ENV_ARGS+=(-e "PKR_VAR_granite_goss_binary_url=${{ github.event.inputs.goss_binary_url }}")
          
          docker run --rm \
            -v "$(pwd):/workspace" \
            "${DOCKER_ENV_ARGS[@]}" \
            "granite-builder:${IMAGE_TAG}" \
            make -f Makefile.granite build

      - name: Create build summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## Granite Build Summary
          
          ### Build Configuration
          | Property | Value |
          |----------|-------|
          | Docker Image | \`granite-builder:${IMAGE_TAG}\` |
          | Granite Version | \`${GRANITE_VERSION}\` |
          | Build Time | $(date -u +%Y-%m-%dT%H:%M:%SZ) |
          | Git Commit | \`${GITHUB_SHA:0:8}\` |
          
          ### Infrastructure (from infra-setup.yml)
          | Resource | Value |
          |----------|-------|
          | VPC ID | \`${{ needs.infra.outputs.vpc_id }}\` |
          | Subnet ID | \`${{ needs.infra.outputs.subnet_id }}\` |
          | Security Group | \`${{ needs.infra.outputs.security_group_id }}\` |
          | Instance Profile | \`${{ needs.infra.outputs.instance_profile }}\` |
          | KMS Key | \`${{ needs.infra.outputs.kms_key_id }}\` |
          
          ### Selected Builders
          EOF
          
          if [ "${{ github.event.inputs.run_amzn2023 }}" = "true" ]; then
            echo "- ✅ Amazon Linux 2023" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ github.event.inputs.run_ol9 }}" = "true" ]; then
            echo "- ✅ Oracle Linux 9" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ github.event.inputs.run_rhel9 }}" = "true" ]; then
            echo "- ✅ RHEL 9" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ github.event.inputs.run_ol8 }}" = "true" ]; then
            echo "- ✅ Oracle Linux 8" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ github.event.inputs.run_rhel8 }}" = "true" ]; then
            echo "- ✅ RHEL 8" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ github.event.inputs.run_ws2016 }}" = "true" ]; then
            echo "- ✅ Windows Server 2016" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ github.event.inputs.run_ws2019 }}" = "true" ]; then
            echo "- ✅ Windows Server 2019" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ github.event.inputs.run_ws2022 }}" = "true" ]; then
            echo "- ✅ Windows Server 2022" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifact" >> $GITHUB_STEP_SUMMARY
          echo "Docker image artifact: \`${{ github.event.inputs.docker_image_artifact }}\`" >> $GITHUB_STEP_SUMMARY
          
          # Air-gapped configuration (if any configured)
          if [ -n "${{ github.event.inputs.repo_mirror_baseurl }}" ] || \
             [ "${{ github.event.inputs.airgap_mode }}" = "true" ]; then
            cat >> $GITHUB_STEP_SUMMARY << 'AIRGAP'
          
          ### Air-Gapped Configuration
          | Setting | Value |
          |---------|-------|
          AIRGAP
            if [ -n "${{ github.event.inputs.repo_mirror_baseurl }}" ]; then
              echo "| Repo Mirror | \`${{ github.event.inputs.repo_mirror_baseurl }}\` |" >> $GITHUB_STEP_SUMMARY
            fi
            if [ "${{ github.event.inputs.airgap_mode }}" = "true" ]; then
              echo "| Air-Gap Mode | ✅ Enabled (cross_distro, no_default_repos, nosig, no_sslverify) |" >> $GITHUB_STEP_SUMMARY
            fi
          fi

      - name: Test Windows AMI Instance Type Compatibility
        if: |
          github.event.inputs.test_windows_instance_types == 'true' && 
          (github.event.inputs.run_ws2016 == 'true' || 
           github.event.inputs.run_ws2019 == 'true' || 
           github.event.inputs.run_ws2022 == 'true')
        run: |
          echo "=== Testing Windows AMI Instance Type Compatibility ==="
          echo ""
          
          # Find packer manifest
          MANIFEST=".granite/${GRANITE_VERSION}/packer-manifest.json"
          if [[ ! -f "$MANIFEST" ]]; then
            echo "ERROR: Packer manifest not found at $MANIFEST"
            echo ""
            echo "Checking .granite directory contents:"
            ls -la .granite/ || echo "  .granite/ directory not found"
            echo ""
            echo "Checking version directory:"
            ls -la ".granite/${GRANITE_VERSION}/" 2>/dev/null || echo "  .granite/${GRANITE_VERSION}/ not found"
            echo ""
            echo "Looking for any manifest files:"
            find .granite -name "*.json" -o -name "*manifest*" 2>/dev/null || echo "  No manifest files found"
            echo ""
            echo "This could mean:"
            echo "  1. The Windows build failed before creating AMI"
            echo "  2. The manifest post-processor is missing from hardened-linux.pkr.hcl"
            echo "  3. The build was interrupted"
            echo ""
            echo "Check the 'Build STIGed AMI's' step logs for errors."
            exit 1
          fi
          
          echo "Found manifest: $MANIFEST"
          cat "$MANIFEST" | jq '.builds[] | {name: .name, artifact_id: .artifact_id}'
          echo ""
          
          # Extract Windows AMI IDs from manifest
          WINDOWS_AMIS=$(jq -r '.builds[] | select(.name | contains("windows")) | .artifact_id' "$MANIFEST" | cut -d: -f2)
          
          if [[ -z "$WINDOWS_AMIS" ]]; then
            echo "No Windows AMIs found in manifest"
            exit 0
          fi
          
          # Get infrastructure from infra job outputs
          SUBNET_ID="${{ needs.infra.outputs.subnet_id }}"
          SG_ID="${{ needs.infra.outputs.security_group_id }}"
          
          if [[ -z "$SUBNET_ID" ]] || [[ -z "$SG_ID" ]]; then
            echo "ERROR: Missing infrastructure (subnet_id or security_group_id)"
            echo "  SUBNET_ID: $SUBNET_ID"
            echo "  SG_ID: $SG_ID"
            exit 1
          fi
          
          # Test each Windows AMI
          TEST_FAILED=false
          for AMI_ID in $WINDOWS_AMIS; do
            echo ""
            echo "============================================="
            echo "Testing AMI: $AMI_ID"
            echo "============================================="
            
            if ! ./tests/test-windows-instance-types.sh --quick "$AMI_ID" "$SUBNET_ID" "$SG_ID"; then
              echo "ERROR: Instance type test failed for $AMI_ID"
              TEST_FAILED=true
            fi
          done
          
          if $TEST_FAILED; then
            echo ""
            echo "ERROR: One or more Windows AMIs failed instance type testing"
            exit 1
          fi
          
          echo ""
          echo "=== All Windows AMI instance type tests passed ==="

      - name: Test SSM Validation on Built AMIs
        if: |
          github.event.inputs.run_amzn2023 == 'true' ||
          github.event.inputs.run_rhel9 == 'true' ||
          github.event.inputs.run_rhel8 == 'true' ||
          github.event.inputs.run_ol9 == 'true' ||
          github.event.inputs.run_ol8 == 'true'
        run: |
          echo "=== Testing SSM Validation on Linux AMIs ==="
          echo ""
          
          MANIFEST=".granite/${GRANITE_VERSION}/packer-manifest.json"
          if [[ ! -f "$MANIFEST" ]]; then
            echo "WARNING: Packer manifest not found - skipping SSM validation"
            exit 0
          fi
          
          # Get infrastructure from infra job outputs
          SUBNET_ID="${{ needs.infra.outputs.subnet_id }}"
          SG_ID="${{ needs.infra.outputs.security_group_id }}"
          INSTANCE_PROFILE="${{ needs.infra.outputs.instance_profile }}"
          
          if [[ -z "$SUBNET_ID" ]] || [[ -z "$SG_ID" ]] || [[ -z "$INSTANCE_PROFILE" ]]; then
            echo "WARNING: Missing infrastructure - skipping SSM validation"
            exit 0
          fi
          
          # Pre-flight: Verify the runner's IAM role has SSM read permissions
          echo "Checking SSM API permissions..."
          if ! aws ssm describe-instance-information --max-results 5 --query 'InstanceInformationList' --output text 2>&1; then
            echo ""
            echo "ERROR: The runner IAM role (Packer_Amazon) lacks SSM permissions."
            echo "The SSM validation test requires ssm:DescribeInstanceInformation"
            echo "and ssm:SendCommand on the runner's IAM role."
            echo ""
            echo "Add the following to the Packer_Amazon IAM role policy:"
            echo '  {'
            echo '    "Effect": "Allow",'
            echo '    "Action": ['
            echo '      "ssm:DescribeInstanceInformation",'
            echo '      "ssm:SendCommand",'
            echo '      "ssm:GetCommandInvocation",'
            echo '      "ssm:ListCommandInvocations"'
            echo '    ],'
            echo '    "Resource": "*"'
            echo '  }'
            echo ""
            echo "WARNING: Skipping SSM validation due to missing permissions"
            exit 0
          fi
          echo "✓ SSM API permissions verified"
          echo ""
          
          # Extract hardened Linux AMI IDs from manifest
          LINUX_AMIS=$(jq -r '.builds[] | select(.builder_type == "amazon-ebs") | select(.name | contains("windows") | not) | .artifact_id' "$MANIFEST" | cut -d: -f2)
          
          if [[ -z "$LINUX_AMIS" ]]; then
            echo "No hardened Linux AMIs found in manifest"
            exit 0
          fi
          
          # Test first hardened Linux AMI for SSM connectivity (representative test)
          FIRST_AMI=$(echo "$LINUX_AMIS" | head -1)
          FIRST_AMI_NAME=$(jq -r --arg aid "$FIRST_AMI" '.builds[] | select(.artifact_id | contains($aid)) | .name' "$MANIFEST")
          
          echo "Testing SSM on: $FIRST_AMI_NAME ($FIRST_AMI)"
          
          # Base64-encode the SSM diagnostic userdata script
          SSM_USERDATA=$(base64 -w0 < tests/ssm-userdata-diag.sh)
          
          # Launch test instance with user data for SSM diagnostics
          INSTANCE_ID=$(aws ec2 run-instances \
            --image-id "$FIRST_AMI" \
            --instance-type t3.medium \
            --subnet-id "$SUBNET_ID" \
            --security-group-ids "$SG_ID" \
            --iam-instance-profile "Name=${INSTANCE_PROFILE}" \
            --metadata-options "HttpTokens=optional,HttpPutResponseHopLimit=2,HttpEndpoint=enabled" \
            --user-data "$SSM_USERDATA" \
            --tag-specifications "ResourceType=instance,Tags=[{Key=Name,Value=granite-ssm-test-${GITHUB_RUN_ID}},{Key=Project,Value=GRANITE}]" \
            --query 'Instances[0].InstanceId' --output text)
          
          echo "Launched instance: $INSTANCE_ID"
          echo "Waiting for instance to be running..."
          aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"
          
          # Run SSM validation (skip OSCAP and session for CI speed)
          if ./tests/test-ssm-validation.sh "$INSTANCE_ID" \
              --skip-oscap --skip-session --timeout 180; then
            echo "SSM validation PASSED"
          else
            echo "WARNING: SSM validation failed (non-blocking)"
            echo ""
            echo "=== Console Output (diagnostics) ==="
            sleep 30
            aws ec2 get-console-output --instance-id "$INSTANCE_ID" \
              --query 'Output' --output text 2>/dev/null | tail -120 || \
              echo "(console output not yet available)"
            echo ""
            echo "=== Instance Details ==="
            aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
              --query 'Reservations[0].Instances[0].{State:State.Name,Profile:IamInstanceProfile.Arn,SubnetId:SubnetId,PublicIp:PublicIpAddress,LaunchTime:LaunchTime}' \
              --output table 2>/dev/null || true
            echo "=== End Diagnostics ==="
          fi
          
          # Terminate test instance
          echo "Terminating test instance..."
          aws ec2 terminate-instances --instance-ids "$INSTANCE_ID" || true
          
          echo ""
          echo "=== SSM Validation Complete ==="
