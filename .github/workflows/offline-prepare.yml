# =============================================================================
# Prepare Offline Docker Image
# =============================================================================
# This workflow builds the SPEL Docker image with all dependencies baked in
# and exports it as a portable tarball artifact for use in air-gapped environments.
#
# PREREQUISITES:
#   - Dockerfile must exist in repository root
#   - vendor/amigen8 and vendor/amigen9 submodules must be present
#   - Iron Bank credentials configured as GitHub secrets:
#     - IRONBANK_USERNAME: Robot account username
#     - IRONBANK_PASSWORD: CLI token (expires every 6 months)
#     - Renewal: https://registry1.dso.mil → User Profile → CLI Token → Regenerate
#
# OUTPUTS:
#   - Docker image tarball: spel-builder-YYYYMMDD.tar.gz
#   - Artifact retention: 30 days
#
# USAGE:
#   The exported Docker image can be:
#   1. Downloaded from GitHub Actions artifacts
#   2. Transferred to air-gapped environment
#   3. Imported with: gunzip -c spel-builder-*.tar.gz | docker load
#   4. Run with: docker run -v $(pwd):/workspace spel-builder:<tag> make -f Makefile.spel build
# =============================================================================

name: Prepare Offline Docker Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag (default: YYYYMMDD)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build-docker-image:
    name: Build and Export Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Docker build with all dependencies

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up environment variables
        run: |
          # Use provided tag or default to date
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            IMAGE_TAG="${{ github.event.inputs.image_tag }}"
          else
            IMAGE_TAG="$(date +%Y%m%d)"
          fi
          
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
          echo "IMAGE_NAME=spel-builder" >> $GITHUB_ENV
          echo "FULL_IMAGE=${IMAGE_NAME}:${IMAGE_TAG}" >> $GITHUB_ENV
          
          echo "=== Build Configuration ==="
          echo "Image: spel-builder:${IMAGE_TAG}"
          echo "Date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Verify submodules
        run: |
          echo "=== Verifying AMIgen Submodules ==="
          
          if [ ! -d "vendor/amigen8" ] || [ -z "$(ls -A vendor/amigen8 2>/dev/null)" ]; then
            echo "ERROR: vendor/amigen8 submodule is missing or empty"
            exit 1
          fi
          
          if [ ! -d "vendor/amigen9" ] || [ -z "$(ls -A vendor/amigen9 2>/dev/null)" ]; then
            echo "ERROR: vendor/amigen9 submodule is missing or empty"
            exit 1
          fi
          
          echo "✓ vendor/amigen8: $(ls vendor/amigen8 | wc -l) files"
          echo "✓ vendor/amigen9: $(ls vendor/amigen9 | wc -l) files"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Iron Bank
        uses: docker/login-action@v3
        with:
          registry: registry1.dso.mil
          username: ${{ secrets.IRONBANK_USERNAME }}
          password: ${{ secrets.IRONBANK_PASSWORD }}

      - name: Build Docker image
        run: |
          echo "=== Building Docker Image ==="
          echo "Image: spel-builder:${IMAGE_TAG}"
          echo ""
          
          # Build with buildx for better caching
          docker buildx build \
            --tag "spel-builder:${IMAGE_TAG}" \
            --tag "spel-builder:latest" \
            --load \
            --progress=plain \
            .
          
          echo ""
          echo "=== Build Complete ==="
          docker images spel-builder

      - name: Verify Docker image
        run: |
          echo "=== Verifying Docker Image ==="
          
          # Run quick verification
          docker run --rm "spel-builder:${IMAGE_TAG}" packer version
          docker run --rm "spel-builder:${IMAGE_TAG}" ansible --version
          docker run --rm "spel-builder:${IMAGE_TAG}" aws --version
          
          # Show image details
          echo ""
          echo "=== Image Details ==="
          docker inspect "spel-builder:${IMAGE_TAG}" --format='{{.Id}}' | head -c 20
          echo ""
          docker inspect "spel-builder:${IMAGE_TAG}" --format='Size: {{.Size}} bytes'
          docker inspect "spel-builder:${IMAGE_TAG}" --format='Created: {{.Created}}'

      - name: Export Docker image as tarball
        run: |
          echo "=== Exporting Docker Image ==="
          
          TARBALL_NAME="spel-builder-${IMAGE_TAG}.tar.gz"
          
          # Save and compress
          docker save "spel-builder:${IMAGE_TAG}" | gzip > "${TARBALL_NAME}"
          
          # Generate checksum for binary tarball
          sha256sum "${TARBALL_NAME}" > "${TARBALL_NAME}.sha256"
          
          # Base64 encode for SharePoint transfer compatibility
          echo ""
          echo "=== Base64 encoding for SharePoint transfer ==="
          base64 "${TARBALL_NAME}" > "${TARBALL_NAME}.b64"
          
          # Generate checksum for base64 file
          sha256sum "${TARBALL_NAME}.b64" > "${TARBALL_NAME}.b64.sha256"
          
          echo ""
          echo "=== Export Complete ==="
          echo "Binary tarball (direct transfer):"
          ls -lh "${TARBALL_NAME}"*
          echo ""
          echo "Base64 encoded (SharePoint transfer):"
          ls -lh "${TARBALL_NAME}.b64"*
          echo ""
          cat "${TARBALL_NAME}.sha256"
          cat "${TARBALL_NAME}.b64.sha256"

      - name: Generate manifest
        run: |
          MANIFEST_FILE="spel-builder-${IMAGE_TAG}-manifest.txt"
          
          cat > "${MANIFEST_FILE}" << EOF
          SPEL Builder Docker Image Manifest
          ===================================
          
          Image Tag: spel-builder:${IMAGE_TAG}
          Build Date: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          Git Commit: ${GITHUB_SHA}
          Git Ref: ${GITHUB_REF}
          Workflow Run: ${GITHUB_RUN_ID}
          
          Image Details:
          --------------
          $(docker inspect "spel-builder:${IMAGE_TAG}" --format='Image ID: {{.Id}}')
          $(docker inspect "spel-builder:${IMAGE_TAG}" --format='Size: {{.Size}} bytes')
          $(docker inspect "spel-builder:${IMAGE_TAG}" --format='Created: {{.Created}}')
          
          Baked-in Tools:
          ---------------
          Packer: $(docker run --rm "spel-builder:${IMAGE_TAG}" packer version 2>/dev/null | head -1)
          Ansible: $(docker run --rm "spel-builder:${IMAGE_TAG}" ansible --version 2>/dev/null | head -1)
          Python: $(docker run --rm "spel-builder:${IMAGE_TAG}" python3 --version 2>/dev/null)
          AWS CLI: $(docker run --rm "spel-builder:${IMAGE_TAG}" aws --version 2>/dev/null)
          
          Tarball:
          --------
          $(ls -lh spel-builder-${IMAGE_TAG}.tar.gz)
          
          SHA256 Checksum:
          ----------------
          $(cat spel-builder-${IMAGE_TAG}.tar.gz.sha256)
          
          Usage:
          ------
          # Import the image
          gunzip -c spel-builder-${IMAGE_TAG}.tar.gz | docker load
          
          # Run a build
          docker run --rm \\
            -v \$(pwd):/workspace \\
            -e AWS_ACCESS_KEY_ID \\
            -e AWS_SECRET_ACCESS_KEY \\
            -e AWS_DEFAULT_REGION=us-east-1 \\
            -e SPEL_BUILDERS=amazon-ebssurrogate.minimal-rhel-9-hvm \\
            -e SPEL_VERSION=\$(date +%Y.%m).1 \\
            spel-builder:${IMAGE_TAG} make -f Makefile.spel build
          EOF
          
          cat "${MANIFEST_FILE}"

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: spel-builder-${{ env.IMAGE_TAG }}
          # Both formats included for different transfer scenarios:
          # - .tar.gz: Direct transfers (GitHub→local, USB, SCP) - smaller, faster
          # - .tar.gz.b64: SharePoint transfers (avoids binary corruption) - larger, safer
          path: |
            spel-builder-${{ env.IMAGE_TAG }}.tar.gz
            spel-builder-${{ env.IMAGE_TAG }}.tar.gz.sha256
            spel-builder-${{ env.IMAGE_TAG }}.tar.gz.b64
            spel-builder-${{ env.IMAGE_TAG }}.tar.gz.b64.sha256
            spel-builder-${{ env.IMAGE_TAG }}-manifest.txt
          retention-days: 30
          compression-level: 0  # Already gzipped

      - name: Create summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## SPEL Docker Image Build Summary
          
          | Property | Value |
          |----------|-------|
          | Image Tag | \`spel-builder:${IMAGE_TAG}\` |
          | Build Date | $(date -u +%Y-%m-%dT%H:%M:%SZ) |
          | Git Commit | \`${GITHUB_SHA:0:8}\` |
          | Tarball Size | $(ls -lh spel-builder-${IMAGE_TAG}.tar.gz 2>/dev/null | awk '{print $5}' || echo 'N/A') |
          
          ### Baked-in Tools
          - **Packer**: $(docker run --rm "spel-builder:${IMAGE_TAG}" packer version 2>/dev/null | head -1 || echo 'N/A')
          - **Ansible**: $(docker run --rm "spel-builder:${IMAGE_TAG}" ansible --version 2>/dev/null | head -1 || echo 'N/A')
          - **Python**: $(docker run --rm "spel-builder:${IMAGE_TAG}" python3 --version 2>/dev/null || echo 'N/A')
          - **AWS CLI**: $(docker run --rm "spel-builder:${IMAGE_TAG}" aws --version 2>/dev/null || echo 'N/A')
          
          ### Artifact
          Download the \`spel-builder-${IMAGE_TAG}\` artifact to get:
          - Docker image tarball (portable, air-gap compatible)
          - SHA256 checksum for verification
          - Build manifest with usage instructions
          
          ### Next Steps
          1. Download the artifact from this workflow run
          2. Transfer to your build environment
          3. Import: \`gunzip -c spel-builder-${IMAGE_TAG}.tar.gz | docker load\`
          4. Run builds using the \`build.yml\` workflow or manually with docker run
          EOF
