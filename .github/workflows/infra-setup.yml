# =============================================================================
# Infrastructure Setup for SPEL Builds
# =============================================================================
# This workflow manages ALL SPEL AWS infrastructure using a single Terraform
# root module (infra/). One `terraform apply` creates everything; one
# `terraform destroy` tears it all down.
#
# Infrastructure is persistent — created once and reused across builds.
# build.yml calls this workflow automatically via workflow_call to ensure
# infrastructure exists before every build (terraform apply is idempotent).
#
# RESOURCES CREATED (via Terraform modules):
#   Networking (modules/networking):
#     - VPC with DNS support/hostnames enabled
#     - Subnet with auto-assign public IP (or private if using VPC endpoints)
#     - Internet Gateway + route table (conditional on public subnet)
#     - Security group allowing SSH + WinRM from anywhere (Packer on GitHub Actions)
#   IAM (modules/iam):
#     - IAM role and instance profile for Packer-launched instances
#     - SSM agent communication policies
#   SSM (modules/ssm):
#     - KMS CMK for EBS/SSM encryption
#     - S3 bucket for SSM session logs
#     - CloudWatch log group
#     - VPC endpoints for air-gapped connectivity
#     - Session Manager, Patch Manager, State Manager, STIG Enforcement (configurable)
#
# PREREQUISITES:
#   - AWS credentials with permissions to create VPC, EC2, IAM, KMS, S3, SSM
#   - For GovCloud: Use appropriate partition (aws-us-gov)
#
# USAGE:
#   Manual: Run with action="plan" to review, "apply" to create, "destroy" to teardown
#   Automatic: build.yml calls this with action="apply" before every build
# =============================================================================

name: Infrastructure Setup

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy
          - status
        default: plan
      aws_region:
        description: "AWS region (e.g., us-east-1, us-gov-east-1)"
        required: true
        type: string
        default: "us-east-1"
      infra_prefix:
        description: "Prefix for resource names"
        required: false
        type: string
        default: "spel"
      vpc_cidr:
        description: "VPC CIDR block"
        required: false
        type: string
        default: "10.0.0.0/16"
      subnet_cidr:
        description: "Subnet CIDR block"
        required: false
        type: string
        default: "10.0.1.0/24"
      enable_session_manager:
        description: "Enable SSM Session Manager"
        required: false
        type: boolean
        default: true
      enable_patch_manager:
        description: "Enable SSM Patch Manager"
        required: false
        type: boolean
        default: true
      enable_state_manager:
        description: "Enable SSM State Manager associations"
        required: false
        type: boolean
        default: true
      enable_stig_enforcement:
        description: "Enable STIG enforcement via Ansible Lockdown (EL) and native script (AL2023)"
        required: false
        type: boolean
        default: true
      destroy_confirmation:
        description: "Type 'destroy' to confirm teardown (required for destroy)"
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      action:
        description: "Action to perform (plan, apply, destroy, status)"
        required: true
        type: string
      aws_region:
        description: "AWS region"
        required: true
        type: string
      infra_prefix:
        description: "Prefix for resource names"
        required: false
        type: string
        default: "spel"
      vpc_cidr:
        description: "VPC CIDR block"
        required: false
        type: string
        default: "10.0.0.0/16"
      subnet_cidr:
        description: "Subnet CIDR block"
        required: false
        type: string
        default: "10.0.1.0/24"
      enable_session_manager:
        description: "Enable SSM Session Manager"
        required: false
        type: boolean
        default: true
      enable_patch_manager:
        description: "Enable SSM Patch Manager"
        required: false
        type: boolean
        default: true
      enable_state_manager:
        description: "Enable SSM State Manager associations"
        required: false
        type: boolean
        default: true
      enable_stig_enforcement:
        description: "Enable STIG enforcement via Ansible Lockdown (EL) and native script (AL2023)"
        required: false
        type: boolean
        default: true
      destroy_confirmation:
        description: "Type 'destroy' to confirm teardown"
        required: false
        type: string
        default: ""
    outputs:
      vpc_id:
        description: "VPC ID"
        value: ${{ jobs.infrastructure.outputs.vpc_id }}
      subnet_id:
        description: "Subnet ID"
        value: ${{ jobs.infrastructure.outputs.subnet_id }}
      security_group_id:
        description: "Security Group ID"
        value: ${{ jobs.infrastructure.outputs.security_group_id }}
      instance_profile:
        description: "IAM Instance Profile name"
        value: ${{ jobs.infrastructure.outputs.instance_profile }}
      kms_key_id:
        description: "KMS Key ARN"
        value: ${{ jobs.infrastructure.outputs.kms_key_id }}

permissions:
  id-token: write
  contents: read

jobs:
  infrastructure:
    name: "${{ inputs.action }} Infrastructure"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      vpc_id: ${{ steps.outputs.outputs.vpc_id }}
      subnet_id: ${{ steps.outputs.outputs.subnet_id }}
      security_group_id: ${{ steps.outputs.outputs.security_group_id }}
      instance_profile: ${{ steps.outputs.outputs.instance_profile }}
      kms_key_id: ${{ steps.outputs.outputs.kms_key_id }}

    steps:
      - name: Validate destroy confirmation
        if: inputs.action == 'destroy' && inputs.destroy_confirmation != 'destroy'
        run: |
          echo "::error::Destroy action requires typing 'destroy' in the confirmation field"
          exit 1

      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: infra

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ inputs.aws_region }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN || secrets.AWS_ROLE_ARN }}
          role-session-name: spel-infra-setup
          role-duration-seconds: 3600

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Bootstrap backend
        working-directory: infra
        env:
          AWS_DEFAULT_REGION: ${{ inputs.aws_region }}
        run: |
          source ./bootstrap-backend.sh \
            --prefix "${{ inputs.infra_prefix }}" \
            --region "${{ inputs.aws_region }}"

      - name: Terraform init
        working-directory: infra
        run: terraform init -input=false

      - name: Check infrastructure status
        if: inputs.action == 'status'
        working-directory: infra
        run: |
          echo "=== Infrastructure Status ==="
          echo ""

          # Try to read state — if no state exists, report "not deployed"
          if terraform show -json 2>/dev/null | jq -e '.values.root_module' &>/dev/null; then
            echo "Infrastructure is deployed."
            echo ""
            echo "=== Current Outputs ==="
            terraform output || true
          else
            echo "No Terraform state found — infrastructure has not been deployed."
            echo ""
            echo "Run this workflow with action='apply' to create infrastructure."
          fi

      - name: Generate tfvars
        if: inputs.action == 'plan' || inputs.action == 'apply' || inputs.action == 'destroy'
        working-directory: infra
        run: |
          cat > ci.auto.tfvars <<EOF
          name_prefix             = "${{ inputs.infra_prefix }}"
          vpc_cidr                = "${{ inputs.vpc_cidr }}"
          subnet_cidr             = "${{ inputs.subnet_cidr }}"
          public_subnet           = true
          enable_vpc_endpoints    = true
          enable_session_manager  = ${{ inputs.enable_session_manager }}
          enable_patch_manager    = ${{ inputs.enable_patch_manager }}
          enable_state_manager    = ${{ inputs.enable_state_manager }}
          enable_stig_enforcement = ${{ inputs.enable_stig_enforcement }}
          enable_ssm_agent_update = true
          enable_dhmc             = true
          enable_inventory        = true
          create_kms_key          = true
          EOF

          echo "=== Generated tfvars ==="
          cat ci.auto.tfvars

      - name: Handle pre-existing SSM Session Manager document
        if: inputs.action == 'plan' || inputs.action == 'apply'
        working-directory: infra
        run: |
          # SSM-SessionManagerRunShell is a per-account singleton. If it exists
          # in AWS but not in Terraform state, delete it so Terraform can create
          # it fresh. This handles fresh deploys where a prior stack left it behind.
          if aws ssm describe-document --name SSM-SessionManagerRunShell &>/dev/null; then
            if ! terraform state show 'module.ssm.aws_ssm_document.session_manager_prefs[0]' &>/dev/null; then
              echo "Deleting orphaned SSM-SessionManagerRunShell document..."
              aws ssm delete-document --name SSM-SessionManagerRunShell || true
              echo "Deleted — Terraform will recreate it."
            else
              echo "SSM-SessionManagerRunShell already in Terraform state, skipping."
            fi
          else
            echo "SSM-SessionManagerRunShell does not exist yet, skipping."
          fi

      - name: Terraform plan
        if: inputs.action == 'plan' || inputs.action == 'apply'
        working-directory: infra
        run: |
          terraform plan -input=false -out=tfplan
          echo ""
          echo "=== Plan Summary ==="
          terraform show -no-color tfplan | tail -5

      - name: Terraform apply
        if: inputs.action == 'apply'
        working-directory: infra
        run: |
          terraform apply -auto-approve -input=false tfplan
          echo ""
          echo "=== Infrastructure Created ==="
          terraform output

      - name: Terraform destroy
        if: inputs.action == 'destroy'
        working-directory: infra
        run: |
          echo "::warning::Destroying ALL infrastructure in ${{ inputs.aws_region }}"
          terraform destroy -auto-approve -input=false
          echo ""
          echo "=== Infrastructure Destroyed ==="

      - name: Clean up legacy CLI resources
        if: inputs.action == 'destroy'
        run: |
          # Clean up any legacy CLI-created KMS key from before the Terraform migration
          INFRA_PREFIX="${{ inputs.infra_prefix }}"
          for ALIAS_SUFFIX in "-ebs-key" "-ssm"; do
            KMS_ALIAS="${INFRA_PREFIX}${ALIAS_SUFFIX}"
            LEGACY_KEY_ID=$(aws kms list-aliases \
              --query "Aliases[?AliasName=='alias/${KMS_ALIAS}'].TargetKeyId" \
              --output text 2>/dev/null || echo "")

            if [ -n "$LEGACY_KEY_ID" ] && [ "$LEGACY_KEY_ID" != "None" ]; then
              echo "Cleaning up legacy CLI-managed KMS key (alias/${KMS_ALIAS})..."
              aws kms delete-alias --alias-name "alias/${KMS_ALIAS}" 2>/dev/null || true
              aws kms schedule-key-deletion --key-id "${LEGACY_KEY_ID}" --pending-window-in-days 30 2>/dev/null || true
              echo "✓ Legacy KMS key scheduled for deletion in 30 days"
            fi
          done

          # Clean up legacy IAM resources that may exist from CLI era
          ROLE_NAME="${INFRA_PREFIX}-packer-builder-role"
          PROFILE_NAME="${INFRA_PREFIX}-packer-builder-profile"
          POLICY_NAME="${INFRA_PREFIX}-packer-builder-policy"

          # Instance profile
          if aws iam get-instance-profile --instance-profile-name "${PROFILE_NAME}" &>/dev/null 2>&1; then
            aws iam remove-role-from-instance-profile \
              --instance-profile-name "${PROFILE_NAME}" \
              --role-name "${ROLE_NAME}" 2>/dev/null || true
            aws iam delete-instance-profile --instance-profile-name "${PROFILE_NAME}" 2>/dev/null || true
            echo "✓ Cleaned up legacy instance profile"
          fi

          # Policy
          POLICY_ARN=$(aws iam list-policies --scope Local \
            --query "Policies[?PolicyName=='${POLICY_NAME}'].Arn" --output text 2>/dev/null || echo "")
          if [ -n "$POLICY_ARN" ] && [ "$POLICY_ARN" != "None" ]; then
            aws iam detach-role-policy --role-name "${ROLE_NAME}" --policy-arn "${POLICY_ARN}" 2>/dev/null || true
            aws iam delete-policy --policy-arn "${POLICY_ARN}" 2>/dev/null || true
            echo "✓ Cleaned up legacy IAM policy"
          fi

          # Role — detach any remaining managed policies first
          if aws iam get-role --role-name "${ROLE_NAME}" &>/dev/null 2>&1; then
            aws iam list-attached-role-policies --role-name "${ROLE_NAME}" \
              --query 'AttachedPolicies[].PolicyArn' --output text 2>/dev/null | tr '\t' '\n' | \
              while read -r arn; do
                [ -n "$arn" ] && aws iam detach-role-policy --role-name "${ROLE_NAME}" --policy-arn "$arn" 2>/dev/null || true
              done
            aws iam delete-role --role-name "${ROLE_NAME}" 2>/dev/null || true
            echo "✓ Cleaned up legacy IAM role"
          fi

      - name: Export outputs
        if: inputs.action == 'apply'
        id: outputs
        working-directory: infra
        run: |
          VPC_ID=$(terraform output -raw vpc_id 2>/dev/null || echo "")
          SUBNET_ID=$(terraform output -raw subnet_id 2>/dev/null || echo "")
          SG_ID=$(terraform output -raw security_group_id 2>/dev/null || echo "")
          PROFILE=$(terraform output -raw instance_profile_name 2>/dev/null || echo "")
          KMS_ARN=$(terraform output -raw kms_key_arn 2>/dev/null || echo "")

          echo "vpc_id=${VPC_ID}" >> $GITHUB_OUTPUT
          echo "subnet_id=${SUBNET_ID}" >> $GITHUB_OUTPUT
          echo "security_group_id=${SG_ID}" >> $GITHUB_OUTPUT
          echo "instance_profile=${PROFILE}" >> $GITHUB_OUTPUT
          echo "kms_key_id=${KMS_ARN}" >> $GITHUB_OUTPUT

      - name: Create summary
        if: always()
        working-directory: infra
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'HEADER'
          ## Infrastructure Setup Summary

          | Property | Value |
          |----------|-------|
          HEADER

          cat >> $GITHUB_STEP_SUMMARY << EOF
          | Action | \`${{ inputs.action }}\` |
          | Region | \`${{ inputs.aws_region }}\` |
          | Prefix | \`${{ inputs.infra_prefix }}\` |
          | Time | $(date -u +%Y-%m-%dT%H:%M:%SZ) |
          EOF

          if [ "${{ inputs.action }}" = "apply" ]; then
            cat >> $GITHUB_STEP_SUMMARY << 'SUBHEADER'

          ### Terraform Outputs

          Use these values in the build.yml workflow:

          | Input | Value |
          |-------|-------|
          SUBHEADER

            # Populate from Terraform outputs
            VPC_ID=$(terraform output -raw vpc_id 2>/dev/null || echo "n/a")
            SUBNET_ID=$(terraform output -raw subnet_id 2>/dev/null || echo "n/a")
            SG_ID=$(terraform output -raw security_group_id 2>/dev/null || echo "n/a")
            PROFILE=$(terraform output -raw instance_profile_name 2>/dev/null || echo "n/a")
            KMS_ARN=$(terraform output -raw kms_key_arn 2>/dev/null || echo "n/a")

            cat >> $GITHUB_STEP_SUMMARY << EOF
          | aws_vpc_id | \`${VPC_ID}\` |
          | aws_subnet_id | \`${SUBNET_ID}\` |
          | aws_security_group_id | \`${SG_ID}\` |
          | iam_instance_profile | \`${PROFILE}\` |
          | aws_kms_key_id | \`${KMS_ARN}\` |
          EOF
          fi
