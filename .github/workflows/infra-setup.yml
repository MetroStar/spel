# =============================================================================
# Infrastructure Setup for Crucible Builds
# =============================================================================
# This workflow manages ALL Crucible AWS infrastructure using a single OpenTofu
# root module (infra/). One `tofu apply` creates everything; one
# `tofu destroy` tears it all down.
#
# Infrastructure is persistent — created once and reused across builds.
# build.yml calls this workflow automatically via workflow_call to ensure
# infrastructure exists before every build (tofu apply is idempotent).
#
# RESOURCES CREATED (via OpenTofu modules):
#   Networking (modules/networking):
#     - VPC with DNS support/hostnames enabled
#     - Subnet with auto-assign public IP (or private if air-gapped)
#     - Internet Gateway + route table (disabled for air-gapped builds)
#     - VPC endpoints for EC2 + STS (enabled for air-gapped builds)
#     - Security group allowing SSH + WinRM (scoped to VPC CIDR when air-gapped)
#   IAM (modules/iam):
#     - IAM role and instance profile for Packer-launched instances
#     - SSM agent communication policies
#   SSM (modules/ssm):
#     - KMS CMK for EBS/SSM encryption
#     - S3 bucket for SSM session logs
#     - CloudWatch log group
#     - VPC endpoints for air-gapped connectivity
#     - Session Manager, Patch Manager, State Manager, STIG Enforcement
#
# PREREQUISITES:
#   - AWS credentials with permissions to create VPC, EC2, IAM, KMS, S3, SSM
#   - For GovCloud: Use appropriate partition (aws-us-gov)
#
# USAGE:
#   Manual: Run with action="plan" to review, "apply" to create, "destroy" to teardown
#   Automatic: build.yml calls this with action="apply" before every build
#
# NOTE: Uses OpenTofu (MPL-licensed) via opentofu/setup-opentofu action.
# =============================================================================

name: Infrastructure Setup

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy
          - status
        default: plan
      aws_region:
        description: "AWS region"
        required: true
        type: choice
        options:
          - us-east-1
          - us-east-2
          - us-west-1
          - us-west-2
          - us-gov-east-1
          - us-gov-west-1
        default: "us-east-1"
      vpc_cidr:
        description: "VPC CIDR block"
        required: false
        type: string
        default: "10.0.0.0/16"
      subnet_cidr:
        description: "Subnet CIDR block"
        required: false
        type: string
        default: "10.0.1.0/24"
      airgap_mode:
        description: "Air-gapped build environment (disables IGW, enables VPC endpoints for EC2 + STS)"
        required: false
        type: boolean
        default: false
      destroy_confirmation:
        description: "Type 'destroy' to confirm teardown (required for destroy)"
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      action:
        description: "Action to perform (plan, apply, destroy, status)"
        required: true
        type: string
      aws_region:
        description: "AWS region"
        required: true
        type: string
      vpc_cidr:
        description: "VPC CIDR block"
        required: false
        type: string
        default: "10.0.0.0/16"
      subnet_cidr:
        description: "Subnet CIDR block"
        required: false
        type: string
        default: "10.0.1.0/24"
      airgap_mode:
        description: "Air-gapped build environment (disables IGW, enables VPC endpoints for EC2 + STS)"
        required: false
        type: boolean
        default: false
      destroy_confirmation:
        description: "Type 'destroy' to confirm teardown"
        required: false
        type: string
        default: ""
    outputs:
      vpc_id:
        description: "VPC ID"
        value: ${{ jobs.infrastructure.outputs.vpc_id }}
      subnet_id:
        description: "Subnet ID"
        value: ${{ jobs.infrastructure.outputs.subnet_id }}
      security_group_id:
        description: "Security Group ID"
        value: ${{ jobs.infrastructure.outputs.security_group_id }}
      instance_profile:
        description: "IAM Instance Profile name"
        value: ${{ jobs.infrastructure.outputs.instance_profile }}
      kms_key_id:
        description: "KMS Key ARN"
        value: ${{ jobs.infrastructure.outputs.kms_key_id }}
      s3_bucket_name:
        description: "SSM S3 bucket name"
        value: ${{ jobs.infrastructure.outputs.s3_bucket_name }}

permissions:
  id-token: write
  contents: read

jobs:
  infrastructure:
    name: "${{ inputs.action }} Infrastructure"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      vpc_id: ${{ steps.outputs.outputs.vpc_id }}
      subnet_id: ${{ steps.outputs.outputs.subnet_id }}
      security_group_id: ${{ steps.outputs.outputs.security_group_id }}
      instance_profile: ${{ steps.outputs.outputs.instance_profile }}
      kms_key_id: ${{ steps.outputs.outputs.kms_key_id }}
      s3_bucket_name: ${{ steps.outputs.outputs.s3_bucket_name }}

    steps:
      - name: Validate destroy confirmation
        if: inputs.action == 'destroy' && inputs.destroy_confirmation != 'destroy'
        run: |
          echo "::error::Destroy action requires typing 'destroy' in the confirmation field"
          exit 1

      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: infra

      - name: Validate AWS role ARN
        run: |
          ROLE_ARN="${{ vars.AWS_ROLE_ARN || secrets.AWS_ROLE_ARN }}"
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::AWS_ROLE_ARN is not set. Configure it as a repository variable (Settings > Secrets and variables > Actions > Variables) or secret. See docs/CI-CD-Setup.md#aws-iam-configuration."
            exit 1
          fi
          echo "AWS role ARN is configured"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ inputs.aws_region }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN || secrets.AWS_ROLE_ARN }}
          role-session-name: crucible-infra-setup
          role-duration-seconds: 3600

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.9.0
          tofu_wrapper: false

      - name: Bootstrap backend
        working-directory: infra
        env:
          AWS_DEFAULT_REGION: ${{ inputs.aws_region }}
        run: |
          source ./bootstrap-backend.sh \
            --prefix "crucible" \
            --region "${{ inputs.aws_region }}"

      - name: OpenTofu init
        working-directory: infra
        run: |
          for attempt in 1 2 3; do
            echo "Attempt ${attempt}: tofu init"
            if tofu init -input=false; then
              echo "tofu init succeeded"
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "tofu init failed, retrying in 15s..."
              sleep 15
            else
              echo "::error::tofu init failed after 3 attempts"
              exit 1
            fi
          done

      - name: Check infrastructure status
        if: inputs.action == 'status'
        working-directory: infra
        run: |
          echo "=== Infrastructure Status ==="
          echo ""

          # Try to read state — if no state exists, report "not deployed"
          if tofu show -json 2>/dev/null | jq -e '.values.root_module' &>/dev/null; then
            echo "Infrastructure is deployed."
            echo ""
            echo "=== Current Outputs ==="
            tofu output || true
          else
            echo "No state found — infrastructure has not been deployed."
            echo ""
            echo "Run this workflow with action='apply' to create infrastructure."
          fi

      - name: Generate tfvars
        if: inputs.action == 'plan' || inputs.action == 'apply' || inputs.action == 'destroy'
        working-directory: infra
        run: |
          cat > ci.auto.tfvars <<EOF
          name_prefix             = "crucible"
          vpc_cidr                = "${{ inputs.vpc_cidr }}"
          subnet_cidr             = "${{ inputs.subnet_cidr }}"
          public_subnet           = ${{ !inputs.airgap_mode }}
          enable_internet_gateway = ${{ !inputs.airgap_mode }}
          enable_packer_endpoints = ${{ inputs.airgap_mode }}
          enable_vpc_endpoints    = true
          enable_session_manager  = true
          enable_patch_manager    = true
          enable_state_manager    = true
          enable_stig_enforcement = true
          enable_ssm_agent_update = true
          enable_dhmc             = true
          enable_inventory        = true
          create_kms_key          = true
          EOF

          echo "=== Generated tfvars ==="
          cat ci.auto.tfvars

      - name: OpenTofu plan
        if: inputs.action == 'plan' || inputs.action == 'apply'
        working-directory: infra
        run: |
          tofu plan -input=false -out=tfplan
          echo ""
          echo "=== Plan Summary ==="
          tofu show -no-color tfplan | tail -5

      - name: OpenTofu apply
        if: inputs.action == 'apply'
        working-directory: infra
        run: |
          tofu apply -auto-approve -input=false tfplan
          echo ""
          echo "=== Infrastructure Created ==="
          tofu output

      - name: OpenTofu destroy
        if: inputs.action == 'destroy'
        working-directory: infra
        run: |
          echo "::warning::Destroying ALL infrastructure in ${{ inputs.aws_region }}"
          tofu destroy -auto-approve -input=false
          echo ""
          echo "=== Infrastructure Destroyed ==="

      - name: Export outputs
        if: inputs.action == 'apply'
        id: outputs
        working-directory: infra
        run: |
          VPC_ID=$(tofu output -raw vpc_id 2>/dev/null || echo "")
          SUBNET_ID=$(tofu output -raw subnet_id 2>/dev/null || echo "")
          SG_ID=$(tofu output -raw security_group_id 2>/dev/null || echo "")
          PROFILE=$(tofu output -raw instance_profile_name 2>/dev/null || echo "")
          KMS_ARN=$(tofu output -raw kms_key_arn 2>/dev/null || echo "")
          S3_BUCKET=$(tofu output -raw s3_bucket_name 2>/dev/null || echo "")

          echo "vpc_id=${VPC_ID}" >> $GITHUB_OUTPUT
          echo "subnet_id=${SUBNET_ID}" >> $GITHUB_OUTPUT
          echo "security_group_id=${SG_ID}" >> $GITHUB_OUTPUT
          echo "instance_profile=${PROFILE}" >> $GITHUB_OUTPUT
          echo "kms_key_id=${KMS_ARN}" >> $GITHUB_OUTPUT
          echo "s3_bucket_name=${S3_BUCKET}" >> $GITHUB_OUTPUT

      - name: Create summary
        if: always()
        working-directory: infra
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'HEADER'
          ## Infrastructure Setup Summary

          | Property | Value |
          |----------|-------|
          HEADER

          cat >> $GITHUB_STEP_SUMMARY << EOF
          | Action | \`${{ inputs.action }}\` |
          | Region | \`${{ inputs.aws_region }}\` |
          | Prefix | \`crucible\` |
          | Time | $(date -u +%Y-%m-%dT%H:%M:%SZ) |
          EOF

          if [ "${{ inputs.action }}" = "apply" ]; then
            cat >> $GITHUB_STEP_SUMMARY << 'SUBHEADER'

          ### OpenTofu Outputs

          Use these values in the build.yml workflow:

          | Input | Value |
          |-------|-------|
          SUBHEADER

            # Populate from OpenTofu outputs
            VPC_ID=$(tofu output -raw vpc_id 2>/dev/null || echo "n/a")
            SUBNET_ID=$(tofu output -raw subnet_id 2>/dev/null || echo "n/a")
            SG_ID=$(tofu output -raw security_group_id 2>/dev/null || echo "n/a")
            PROFILE=$(tofu output -raw instance_profile_name 2>/dev/null || echo "n/a")
            KMS_ARN=$(tofu output -raw kms_key_arn 2>/dev/null || echo "n/a")

            cat >> $GITHUB_STEP_SUMMARY << EOF
          | aws_vpc_id | \`${VPC_ID}\` |
          | aws_subnet_id | \`${SUBNET_ID}\` |
          | aws_security_group_id | \`${SG_ID}\` |
          | iam_instance_profile | \`${PROFILE}\` |
          | aws_kms_key_id | \`${KMS_ARN}\` |
          EOF
          fi
