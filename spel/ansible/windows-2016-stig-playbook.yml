---
- name: Apply Windows 2016 STIG
  hosts: all
  gather_facts: false
  roles:
    - role: Windows-2016-STIG

  # Restore WinRM after STIG hardening to allow remaining Packer provisioners to run
  # Uses external script file to avoid Jinja2 parsing issues with curly braces
  post_tasks:
    - name: Restore WinRM connectivity for Packer
      script: files/restore-winrm.ps1
      args:
        executable: powershell.exe
