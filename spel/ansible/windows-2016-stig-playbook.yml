---
- name: Apply Windows 2016 STIG
  hosts: all
  gather_facts: false
  roles:
    - role: Windows-2016-STIG

  # CRITICAL: STIG hardening breaks WinRM for new connections. Ansible maintains
  # its existing session, but we cannot rely on multiple post_tasks because
  # changes made by one task may disrupt the connection for subsequent tasks.
  #
  # Solution: Copy everything we need in ONE task, then run a combined cleanup
  # script as fire-and-forget. Even if the connection drops, the script continues.
  post_tasks:
    # Copy all required files first (single connection operation)
    - name: Copy cleanup-sysprep.ps1 to Windows
      win_copy:
        src: ../scripts/cleanup-sysprep.ps1
        dest: C:\Windows\Temp\cleanup-sysprep.ps1

    - name: Copy post-stig-cleanup.ps1 to Windows
      win_copy:
        src: files/post-stig-cleanup.ps1
        dest: C:\Windows\Temp\post-stig-cleanup.ps1

    # Run combined cleanup script as fire-and-forget
    # This script handles EC2 networking, cleanup-sysprep, SetupComplete.cmd, and sysprep
    # It will continue running even if the WinRM connection drops
    - name: Run post-STIG cleanup and sysprep (fire-and-forget)
      win_shell: |
        # Start the cleanup script as a detached background job
        $scriptPath = 'C:\Windows\Temp\post-stig-cleanup.ps1'
        $logFile = 'C:\Windows\Temp\post-stig-launch.log'
        "$(Get-Date) - Launching post-stig-cleanup.ps1" | Out-File -FilePath $logFile
        
        # Use Start-Process to spawn detached process
        Start-Process -FilePath 'powershell.exe' -ArgumentList "-ExecutionPolicy Bypass -File `"$scriptPath`"" -WindowStyle Hidden
        
        # Wait a moment to ensure process starts
        Start-Sleep -Seconds 3
        
        # Verify process started
        $proc = Get-Process -Name powershell -ErrorAction SilentlyContinue | Where-Object { $_.CommandLine -like '*post-stig*' }
        if ($proc) {
            "$(Get-Date) - Process started successfully, PID: $($proc.Id)" | Out-File -Append -FilePath $logFile
        } else {
            "$(Get-Date) - Warning: Could not verify process started" | Out-File -Append -FilePath $logFile
        }
        
        "$(Get-Date) - Ansible task completing, script will continue in background" | Out-File -Append -FilePath $logFile
      args:
        executable: powershell.exe
