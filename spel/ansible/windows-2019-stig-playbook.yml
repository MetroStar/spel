---
- name: Apply Windows 2019 STIG
  hosts: all
  gather_facts: false
  roles:
    - role: Windows-2019-STIG

  # ALL post-STIG work must be done here within Ansible's existing WinRM session
  # because STIG hardening breaks WinRM and Packer cannot reconnect after Ansible exits
  post_tasks:
    # Step 1: Restore WinRM connectivity (keeps current session alive)
    - name: Restore WinRM connectivity
      ansible.windows.win_script: files/restore-winrm.ps1

    # Step 2: Restore EC2 networking
    - name: Restore EC2 network functionality
      ansible.windows.win_script: files/restore-ec2-network.ps1

    # Step 3: Copy cleanup-sysprep.ps1 script
    - name: Copy cleanup-sysprep.ps1 to Windows
      win_copy:
        src: ../scripts/cleanup-sysprep.ps1
        dest: C:\Windows\Temp\cleanup-sysprep.ps1

    # Step 4: Run cleanup-sysprep.ps1 (skip sysprep - we'll do it separately)
    - name: Run cleanup-sysprep.ps1
      win_shell: |
        Set-ExecutionPolicy -ExecutionPolicy Bypass -Scope Process -Force
        & 'C:\Windows\Temp\cleanup-sysprep.ps1' -SkipSysprep -Verbose
      args:
        executable: powershell.exe
      async: 1800
      poll: 30

    # Step 5: Create SetupComplete scripts directory
    - name: Ensure SetupComplete scripts directory exists
      win_file:
        path: C:\Windows\Setup\Scripts
        state: directory

    # Step 6: Copy SetupComplete.cmd
    - name: Copy SetupComplete.cmd to Windows
      win_copy:
        src: ../scripts/SetupComplete.cmd
        dest: C:\Windows\Setup\Scripts\SetupComplete.cmd

    # Step 7: Run EC2Launch sysprep (Windows 2019 uses older EC2Launch)
    - name: Run EC2Launch sysprep
      win_shell: |
        & $env:ProgramData\Amazon\EC2-Windows\Launch\Scripts\InitializeInstance.ps1 -Schedule
        & $env:ProgramData\Amazon\EC2-Windows\Launch\Scripts\SysprepInstance.ps1 -NoShutdown
      args:
        executable: powershell.exe
      async: 600
      poll: 0  # Fire and forget - sysprep will shutdown the instance
