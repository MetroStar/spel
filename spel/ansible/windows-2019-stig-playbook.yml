---
- name: Apply Windows 2019 STIG
  hosts: all
  gather_facts: false
  roles:
    - role: Windows-2019-STIG

  # CRITICAL: STIG hardening breaks WinRM for new connections. Ansible maintains
  # its existing session, but we cannot rely on multiple post_tasks because
  # changes made by one task may disrupt the connection for subsequent tasks.
  #
  # Solution: Copy everything we need in ONE task, then run a combined cleanup
  # script as fire-and-forget. Even if the connection drops, the script continues.
  post_tasks:
    # Copy all required files first (single connection operation)
    - name: Copy cleanup-sysprep.ps1 to Windows
      win_copy:
        src: ../scripts/cleanup-sysprep.ps1
        dest: C:\Windows\Temp\cleanup-sysprep.ps1

    - name: Copy post-stig-cleanup.ps1 to Windows
      win_copy:
        src: files/post-stig-cleanup.ps1
        dest: C:\Windows\Temp\post-stig-cleanup.ps1

    # Run combined cleanup script as fire-and-forget
    # This script handles EC2 networking, cleanup-sysprep, SetupComplete.cmd, and sysprep
    # It will continue running even if the WinRM connection drops
    - name: Run post-STIG cleanup and sysprep (fire-and-forget)
      win_shell: |
        Start-Process -FilePath 'powershell.exe' -ArgumentList '-ExecutionPolicy Bypass -File C:\Windows\Temp\post-stig-cleanup.ps1' -WindowStyle Hidden
      args:
        executable: powershell.exe
      async: 60
      poll: 0
