[defaults]
# Collections paths for offline mode
# Packer runs from spel/ directory, so paths are relative to that
# Also include home directory for collections installed during ci-setup.sh
collections_path = ./ansible/collections:~/.ansible/collections

# Roles paths for offline mode  
roles_path = ./ansible/roles:~/.ansible/roles

[ssh_connection]
# Reduce SSH timeout warnings
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
