# =============================================================================
# GitLab CI/CD — Infrastructure Management (Terraform)
# =============================================================================
# Manages all persistent SPEL AWS infrastructure via the consolidated
# Terraform root module at infra/.
#
# Included by .gitlab-ci.yml via:
#   include:
#     - local: '.gitlab/infra.gitlab-ci.yml'
#
# JOBS:
#   infra:plan    — Preview Terraform changes (manual)
#   infra:create  — Apply Terraform to create/update infra (manual)
#   infra:destroy — Destroy all Terraform-managed infra (manual)
# =============================================================================

# Plan infrastructure changes (dry run)
infra:plan:
  stage: infra
  script:
    - echo "=== Planning Infrastructure Changes ==="
    - export AWS_DEFAULT_REGION="${PKR_VAR_aws_region}"

    - |
      TF_CMD=""
      if command -v tofu &>/dev/null; then
        TF_CMD="tofu"
      elif command -v terraform &>/dev/null; then
        TF_CMD="terraform"
      else
        echo "ERROR: Neither terraform nor tofu found"
        exit 1
      fi
      echo "Using: $TF_CMD"

    - |
      cd infra

      source ./bootstrap-backend.sh --prefix "${INFRA_PREFIX}" --region "${PKR_VAR_aws_region}"
      $TF_CMD init -input=false

      cat > ci.auto.tfvars <<TFVARS
      name_prefix             = "${INFRA_PREFIX}"
      vpc_cidr                = "10.0.0.0/16"
      subnet_cidr             = "10.0.1.0/24"
      public_subnet           = true
      enable_vpc_endpoints    = true
      enable_session_manager  = true
      enable_patch_manager    = true
      enable_state_manager    = true
      enable_stig_enforcement = true
      enable_ssm_agent_update = true
      enable_dhmc             = true
      enable_inventory        = true
      create_kms_key          = true
      TFVARS

      echo "=== Generated tfvars ==="
      cat ci.auto.tfvars

      $TF_CMD plan -input=false

      echo ""
      echo "=== Plan Complete ==="
      echo "Run infra:create to apply these changes."
  tags:
    - spel-offline-runner
  rules:
    - if: '$PLAN_INFRASTRUCTURE == "true"'
      when: manual
    - when: never

# Create or update all persistent infrastructure (single terraform apply)
infra:create:
  stage: infra
  script:
    - echo "=== Creating All Infrastructure via Terraform ==="
    - export AWS_DEFAULT_REGION="${PKR_VAR_aws_region}"

    - |
      TF_CMD=""
      if command -v tofu &>/dev/null; then
        TF_CMD="tofu"
      elif command -v terraform &>/dev/null; then
        TF_CMD="terraform"
      else
        echo "ERROR: Neither terraform nor tofu found"
        exit 1
      fi
      echo "Using: $TF_CMD"

    - |
      cd infra

      source ./bootstrap-backend.sh --prefix "${INFRA_PREFIX}" --region "${PKR_VAR_aws_region}"
      $TF_CMD init -input=false

      cat > ci.auto.tfvars <<TFVARS
      name_prefix             = "${INFRA_PREFIX}"
      vpc_cidr                = "10.0.0.0/16"
      subnet_cidr             = "10.0.1.0/24"
      public_subnet           = true
      enable_vpc_endpoints    = true
      enable_session_manager  = true
      enable_patch_manager    = true
      enable_state_manager    = true
      enable_stig_enforcement = true
      enable_ssm_agent_update = true
      enable_dhmc             = true
      enable_inventory        = true
      create_kms_key          = true
      TFVARS

      echo "=== Generated tfvars ==="
      cat ci.auto.tfvars

      $TF_CMD plan -input=false -out=tfplan
      $TF_CMD apply -auto-approve -input=false tfplan

      # Export outputs for build jobs via dotenv artifact
      echo "PKR_VAR_aws_vpc_id=$($TF_CMD output -raw vpc_id)" > ../infra.env
      echo "PKR_VAR_aws_subnet_id=$($TF_CMD output -raw subnet_id)" >> ../infra.env
      echo "PKR_VAR_aws_security_group_id=$($TF_CMD output -raw security_group_id)" >> ../infra.env
      echo "PKR_VAR_iam_instance_profile=$($TF_CMD output -raw instance_profile_name)" >> ../infra.env
      echo "PKR_VAR_aws_kms_key_id=$($TF_CMD output -raw kms_key_arn 2>/dev/null || echo '')" >> ../infra.env
      echo "S3_BUCKET_NAME=$($TF_CMD output -raw s3_bucket_name 2>/dev/null || echo '')" >> ../infra.env

      echo ""
      echo "=== All Infrastructure Created ==="
      $TF_CMD output

    # Upload STIG playbooks to S3 — extract roles from the Docker image
    # (no internet access needed; roles are baked into spel-builder)
    - |
      S3_BUCKET=$($TF_CMD -chdir=infra output -raw s3_bucket_name 2>/dev/null || echo "")
      if [ -z "$S3_BUCKET" ]; then
        echo "WARNING: Could not determine S3 bucket name — skipping playbook upload"
      else
        echo "=== Uploading STIG Playbooks to s3://${S3_BUCKET} ==="

        # Resolve the Docker image tag (set by import:docker stage)
        DOCKER_TAG=${DOCKER_IMAGE_TAG:-latest}
        echo "Extracting roles from spel-builder:${DOCKER_TAG}"

        # Extract Ansible Lockdown roles from the Docker image
        ROLES_DIR="${CI_PROJECT_DIR}/spel/ansible/roles"
        mkdir -p "$ROLES_DIR"
        CID=$(docker create "spel-builder:${DOCKER_TAG}" /bin/true)
        for ROLE in RHEL8-STIG RHEL9-STIG Windows-2016-STIG Windows-2019-STIG Windows-2022-STIG; do
          docker cp "${CID}:/opt/ansible/roles/${ROLE}" "$ROLES_DIR/" 2>/dev/null && \
            echo "  [OK] Extracted ${ROLE}" || \
            echo "  [WARN] ${ROLE} not found in image"
        done
        docker rm "$CID" > /dev/null

        # Package EL playbooks and upload
        echo ""
        echo "--- Packaging EL STIG playbooks ---"
        mkdir -p "${CI_PROJECT_DIR}/dist"
        bash "${CI_PROJECT_DIR}/tests/package-ansible-stig.sh" \
          --output "${CI_PROJECT_DIR}/dist" \
          --s3-bucket "$S3_BUCKET" \
          --s3-prefix "ansible" \
          --os-target all

        aws s3 cp "${CI_PROJECT_DIR}/dist/ansible-stig-all-latest.zip" \
          "s3://${S3_BUCKET}/ansible/stig-playbook.zip"
        echo "  [OK] s3://${S3_BUCKET}/ansible/stig-playbook.zip"

        # Package Windows STIG playbooks
        echo ""
        echo "--- Packaging Windows STIG playbooks ---"
        WIN_STAGING=$(mktemp -d)
        mkdir -p "$WIN_STAGING/roles"
        for ROLE in Windows-2016-STIG Windows-2019-STIG Windows-2022-STIG; do
          [ -d "$ROLES_DIR/$ROLE" ] && cp -a "$ROLES_DIR/$ROLE" "$WIN_STAGING/roles/"
        done
        for PB in windows-2016-stig-playbook.yml windows-2019-stig-playbook.yml windows-2022-stig-playbook.yml; do
          [ -f "${CI_PROJECT_DIR}/spel/ansible/$PB" ] && cp "${CI_PROJECT_DIR}/spel/ansible/$PB" "$WIN_STAGING/"
        done
        (cd "$WIN_STAGING" && zip -qr "${CI_PROJECT_DIR}/dist/windows-stig-playbook.zip" .)
        aws s3 cp "${CI_PROJECT_DIR}/dist/windows-stig-playbook.zip" \
          "s3://${S3_BUCKET}/ansible/windows-stig-playbook.zip"
        echo "  [OK] s3://${S3_BUCKET}/ansible/windows-stig-playbook.zip"
        rm -rf "$WIN_STAGING"

        echo ""
        echo "=== Playbook Upload Complete ==="
      fi
  artifacts:
    reports:
      dotenv: infra.env
    expire_in: 90 days
  tags:
    - spel-offline-runner
  rules:
    - if: '$CREATE_INFRASTRUCTURE == "true"'
      when: manual

# Destroy all persistent infrastructure (single terraform destroy)
infra:destroy:
  stage: infra
  script:
    - echo "=== Destroying All Infrastructure via Terraform ==="
    - export AWS_DEFAULT_REGION="${PKR_VAR_aws_region}"

    - |
      TF_CMD=""
      if command -v tofu &>/dev/null; then
        TF_CMD="tofu"
      elif command -v terraform &>/dev/null; then
        TF_CMD="terraform"
      else
        echo "ERROR: Neither terraform nor tofu found"
        exit 1
      fi
      echo "Using: $TF_CMD"

    - |
      cd infra

      source ./bootstrap-backend.sh --prefix "${INFRA_PREFIX}" --region "${PKR_VAR_aws_region}"
      $TF_CMD init -input=false

      echo ""
      echo "=== Destroying All Infrastructure ==="
      echo "WARNING: This will remove ALL Terraform-managed SPEL resources."
      echo ""

      $TF_CMD destroy -auto-approve -input=false

      echo ""
      echo "=== All Infrastructure Destroyed ==="
  tags:
    - spel-offline-runner
  rules:
    - if: '$DESTROY_INFRASTRUCTURE == "true"'
      when: manual
